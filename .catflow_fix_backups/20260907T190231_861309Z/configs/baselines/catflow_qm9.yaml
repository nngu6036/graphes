# Source-backed CatFlow on frozen GraphER qm9 splits.
# Rerun starting point, not a claim of paper-identical settings or reproduced metrics.
catflow:
  train:
    epochs: 300
    batch_size: 1024
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
