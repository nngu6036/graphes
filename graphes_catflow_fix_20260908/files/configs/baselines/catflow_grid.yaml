# Source-backed CatFlow on frozen GraphER grid splits.
# Rerun starting point, not a claim of paper-identical settings or reproduced metrics.
catflow:
  train:
    epochs: 1000
    batch_size: 2
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear  # v2: no fixed endpoint noise; pairs with the sampling velocity
    validation_every: 100
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto  # best for v2, last (with warning) for legacy checkpoints
  generation_batch_size: 2
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
