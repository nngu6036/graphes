# Spectral + graphlet-logit diffusion GraphER: MEDIUM budget
# All three budget variants keep the same diffusion/objective settings.
# They vary stochastic training exposure and generation search budget.

experiment: community_small_topology_spectral_graphlet_medium
benchmark: community_small
seed: 42
pipeline:
  stage: topology
  factorization: dhvae_hh_then_spectral_graphlet_diffusion_guided_degree_rewiring
protocol:
  evaluation_seeds:
  - 42
  report_mean_and_std: false
  generated_graphs_per_seed: 512
  max_reference_graphs: null
  tune_on_split: val
  final_split: test
dataset:
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null
training_sources:
  mode: target_degree_havel_hakimi
graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: true
  clustering_bins: 20
  spectral_summary: false
  motif_proxy: false
  orbit_count: true
spectral_prediction:
  require_same_degree_sequence: true
  distance: rmse
  normalization: mean_degree
  low_frequency_weight: 1.5
  low_frequency_cutoff: 6
graphlet_diffusion:
  enabled: true
  representation: clr_logits
  include_disconnected_bin: true
  logit_epsilon: 0.0001
  distance: clr_rmse
  size_weights:
    '3': 1.5
    '4': 2.5
    '5': 0.75
summary_diffusion:
  storage: streaming
  bridge: brownian_endpoint_conditioned
  schedule: cosine
  power: 2.0
  spectral_sigma: 0.2
  preserve_spectral_trace: true
  fix_spectral_lambda1: true
  graphlet_sigma: 0.35
  samples_per_graph: 16
  paths_per_graph: 1
  time_sampling: stratified
  min_progress: 0.0
  max_progress: 1.0
  source_randomization_steps: 0
  random_relabel_source: true
  ensure_connected_source: true
  max_repair_trials: 10000
topology_predictor:
  type: spectral_graphlet_transformer
  checkpoint_path: outputs/topology_grapher/community_small_spectral_graphlet_medium/seed_42/checkpoint.pt
  device: auto
  hidden_dim: 192
  edge_dim: 96
  graph_dim: 192
  num_layers: 4
  spectral_dim: 192
  spectral_layers: 4
  spectral_heads: 6
  spectral_ff_dim: 768
  graphlet_dim: 384
  graphlet_dropout: 0.03
  dropout: 0.05
  min_gap: 1.0e-06
  input_normalization: mean_degree
  batch_size: 8
  epochs: 200
  learning_rate: 0.00015
  weight_decay: 5.0e-05
  loss_weights:
    spectrum: 0.75
    moment2: 0.25
    low_frequency: 0.75
    low_frequency_k: 6
    graphlet_logit: 2.0
    graphlet_probability: 1.0
  progress_interval: 10
generation:
  degree_source: learned
  num_generate: 512
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false
degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/baselines/dhvae_hh/community_small/seed_42/train/checkpoints/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  max_resample: 500
  parity_conditioned: true
  max_parity_resample: 64
  postprocess_policy: reject_only
  fallback: error
constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000
topology_refiner:
  mode: spectral_graphlet
  steps: 96
  proposal_budget: 512
  valid_candidate_budget: 128
  preserve_connectivity: true
  reject_revisited_states: true
  selection: greedy
  temperature: 0.1
  accept_only_improving: true
  min_improvement: 1.0e-10
  min_relative_improvement: 1.0e-06
  relative_improvement_epsilon: 1.0e-12
  spectral_guidance:
    distance: rmse
    normalization: mean_degree
    low_frequency_weight: 1.5
    low_frequency_cutoff: 6
    schedule: cosine
    min_clean_mix: 0.25
    max_clean_mix: 1.0
    power: 2.0
    expand_on_plateau: true
    plateau_expand_factor: 1.25
    max_plateau_expansions: 8
  graphlet_guidance:
    distance: clr_rmse
    logit_epsilon: 0.0001
    size_weights:
      '3': 1.5
      '4': 2.5
      '5': 0.75
    schedule: cosine
    min_clean_mix: 0.15
    max_clean_mix: 1.0
    power: 1.5
    plateau_expand_factor: 1.25
  global_to_local:
    schedule: linear
    spectral_initial: 0.8
    spectral_final: 0.15
    graphlet_initial: 0.5
    graphlet_final: 3.0
    power: 1.0
  prediction_horizon:
    mode: annealed
    initial_k: 4
    final_k: 1
    schedule: cosine
    refresh_on_plateau: true
  debug:
    enabled: false
    print_every: 1
    top_candidates: 5
    spectrum_values: 12
    store_spectra: false
evaluation:
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
