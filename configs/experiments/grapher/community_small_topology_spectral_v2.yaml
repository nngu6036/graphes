experiment: community_small_topology_spectral_v2
benchmark: community_small
seed: 42

pipeline:
  stage: topology
  factorization: dhvae_hh_then_spectral_transformer_guided_degree_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: null
  tune_on_split: val
  final_split: test

dataset:
  # Community-small retains the historical serialized dataset name `sbm`.
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null

# Each clean training graph is paired with an HH realization having
# exactly the same indexed degree sequence. Rewiring therefore remains
# inside the same degree fibre throughout training and generation.
training_sources:
  mode: target_degree_havel_hakimi

# Retained for evaluation only. These are NOT predictor targets.
graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: true
  clustering_bins: 20
  spectral_summary: false
  motif_proxy: false
  orbit_count: true

# Eigenvalue-only spectral guidance.
# Low-frequency components receive additional weight because they encode
# important global and mesoscopic graph structure.
spectral_prediction:
  require_same_degree_sequence: true
  distance: rmse
  normalization: mean_degree
  low_frequency_weight: 2.0
  low_frequency_cutoff: 6

# High-budget oracle trajectories.
# The teacher uses the true clean spectrum to create valid intermediate
# graphs using degree-preserving double-edge swaps.
topology_trajectory:
  storage: eager

  steps: 128
  proposal_budget: 1024
  valid_candidate_budget: 256

  # Increase state diversity substantially compared with V1.
  states_per_graph: 32
  paths_per_graph: 6

  # Generation begins from HH, so training should do the same.
  source_randomization_steps: 0
  random_relabel_source: true

  teacher_mode: soft
  teacher_temperature: 0.02
  teacher_top_k: 8
  teacher_sample_actions: true
  teacher_min_improvement: 0.000000001
  target_tolerance: 0.0

  preserve_connectivity: true
  ensure_connected_source: true
  max_repair_trials: 10000

topology_predictor:
  type: spectral_transformer
  checkpoint_path: outputs/topology_grapher/community_small_spectral_v2/seed_42/checkpoint.pt
  device: auto

  # Stronger graph-state encoder.
  hidden_dim: 256
  edge_dim: 128
  graph_dim: 256
  num_layers: 6

  # Variable-length Spectral Transformer.
  # One token is used for each eigenvalue, with padding/masking only
  # for batching. All eigenvalues are predicted jointly.
  spectral_dim: 256
  spectral_layers: 6
  spectral_heads: 8
  spectral_ff_dim: 1024

  dropout: 0.05
  min_gap: 0.000001
  input_normalization: mean_degree

  batch_size: 4

  # Much larger optimization budget than V1.
  epochs: 600
  learning_rate: 0.00015
  weight_decay: 0.00005

  loss_weights:
    # Full-spectrum reconstruction.
    spectrum: 1.0

    # Degree-preserving graphs also satisfy
    # sum(lambda_i^2) = sum_v d_v^2 + 2m.
    moment2: 1.0

    # Extra emphasis on low-frequency spectral components.
    low_frequency: 1.5
    low_frequency_k: 6

  progress_interval: 10

generation:
  degree_source: learned
  num_generate: 1024
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/baselines/dhvae_hh/community_small/seed_42/train/checkpoints/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  max_resample: 500
  parity_conditioned: true
  max_parity_resample: 64
  postprocess_policy: reject_only
  fallback: error

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

topology_refiner:
  mode: spectral

  # Large number of possible accepted rewiring steps.
  steps: 192

  # High-budget candidate search.
  proposal_budget: 2048
  valid_candidate_budget: 512

  preserve_connectivity: true
  reject_revisited_states: true

  selection: greedy
  temperature: 0.1

  accept_only_improving: true

  # Allow small but genuinely positive improvements.
  min_improvement: 0.0000000001
  min_relative_improvement: 0.000001
  relative_improvement_epsilon: 0.000000000001

  spectral_guidance:
    distance: rmse
    normalization: mean_degree

    # Emphasize low-frequency structure during candidate scoring.
    low_frequency_weight: 2.0
    low_frequency_cutoff: 6

    # Smooth clean-spectrum guidance.
    schedule: cosine
    min_clean_mix: 0.20
    max_clean_mix: 1.0
    power: 2.0

    # Gradually move toward the clean prediction if the current
    # intermediate target cannot be reached by valid swaps.
    expand_on_plateau: true
    plateau_expand_factor: 1.35
    max_plateau_expansions: 12

  # Keep one clean-spectrum prediction fixed across several accepted
  # rewiring operations. Early generation uses a longer horizon;
  # near the final state predictions are refreshed more frequently.
  prediction_horizon:
    mode: annealed
    initial_k: 8
    final_k: 2
    schedule: cosine
    refresh_on_plateau: true

  # Disable detailed logging for the full 1024-graph benchmark.
  # Enable with:
  #   --set topology_refiner.debug.enabled=true
  # for a small diagnostic generation run.
  debug:
    enabled: false
    print_every: 1
    top_candidates: 5
    spectrum_values: 12
    store_spectra: false

evaluation:
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192