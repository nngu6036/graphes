experiment: community_small_topology_spectral_graphlet
benchmark: community_small
seed: 42

pipeline:
  stage: topology
  factorization: dhvae_hh_then_spectral_graphlet_diffusion_guided_degree_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: null
  tune_on_split: val
  final_split: test

dataset:
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null

training_sources:
  mode: target_degree_havel_hakimi

# Exact connected graphlet classes define the fixed coordinates.  The dual
# model augments every order with one disconnected-subset bin, so each k-block
# is a genuine probability simplex over all induced k-node subsets.
graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: true
  clustering_bins: 20
  spectral_summary: false
  motif_proxy: false
  orbit_count: true

spectral_prediction:
  require_same_degree_sequence: true
  distance: rmse
  normalization: mean_degree
  low_frequency_weight: 2.0
  low_frequency_cutoff: 6

# Graphlet diffusion operates in centered log-ratio (CLR) coordinates.  The
# clean target for every order is [connected graphlet probabilities,
# disconnected-subset probability].
graphlet_diffusion:
  enabled: true
  representation: clr_logits
  include_disconnected_bin: true
  logit_epsilon: 0.00001
  distance: clr_rmse
  size_weights:
    "3": 1.0
    "4": 1.0
    "5": 1.0

# Actual intermediate training states remain valid degree-preserving graphs.
# The existing clean-spectrum oracle creates broad same-degree-fibre state
# coverage; both clean spectrum and clean graphlet logits supervise every state.
topology_trajectory:
  storage: eager
  steps: 128
  proposal_budget: 1024
  valid_candidate_budget: 256
  states_per_graph: 32
  paths_per_graph: 6
  source_randomization_steps: 0
  random_relabel_source: true
  teacher_mode: soft
  teacher_temperature: 0.02
  teacher_top_k: 8
  teacher_sample_actions: true
  teacher_min_improvement: 0.000000001
  target_tolerance: 0.0
  preserve_connectivity: true
  ensure_connected_source: true
  max_repair_trials: 10000

topology_predictor:
  type: spectral_graphlet_transformer
  checkpoint_path: outputs/topology_grapher/community_small_spectral_graphlet/seed_42/checkpoint.pt
  device: auto

  # Shared permutation-invariant graph-state encoder.
  hidden_dim: 256
  edge_dim: 128
  graph_dim: 256
  num_layers: 6

  # Global branch: variable-length Spectral Transformer.
  spectral_dim: 256
  spectral_layers: 6
  spectral_heads: 8
  spectral_ff_dim: 1024

  # Local branch: one residual CLR-logit denoising head per graphlet order.
  graphlet_dim: 256
  graphlet_dropout: 0.05

  dropout: 0.05
  min_gap: 0.000001
  input_normalization: mean_degree
  batch_size: 4
  epochs: 600
  learning_rate: 0.00015
  weight_decay: 0.00005

  loss_weights:
    spectrum: 1.0
    moment2: 1.0
    low_frequency: 1.5
    low_frequency_k: 6
    graphlet_logit: 1.0
    graphlet_probability: 0.25

  progress_interval: 10

generation:
  degree_source: learned
  num_generate: 1024
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/baselines/dhvae_hh/community_small/seed_42/train/checkpoints/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  max_resample: 500
  parity_conditioned: true
  max_parity_resample: 64
  postprocess_policy: reject_only
  fallback: error

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

topology_refiner:
  mode: spectral_graphlet
  steps: 192
  proposal_budget: 2048
  valid_candidate_budget: 512
  preserve_connectivity: true
  reject_revisited_states: true
  selection: greedy
  temperature: 0.1
  accept_only_improving: true
  min_improvement: 0.0000000001
  min_relative_improvement: 0.000001
  relative_improvement_epsilon: 0.000000000001

  spectral_guidance:
    distance: rmse
    normalization: mean_degree
    low_frequency_weight: 2.0
    low_frequency_cutoff: 6
    schedule: cosine
    min_clean_mix: 0.20
    max_clean_mix: 1.0
    power: 2.0
    expand_on_plateau: true
    plateau_expand_factor: 1.35
    max_plateau_expansions: 12

  graphlet_guidance:
    distance: clr_rmse
    logit_epsilon: 0.00001
    size_weights:
      "3": 1.0
      "4": 1.0
      "5": 1.0
    # Local structure is introduced more gently than the global spectrum.
    schedule: cosine
    min_clean_mix: 0.05
    max_clean_mix: 1.0
    power: 2.0
    plateau_expand_factor: 1.35

  # Coarse-to-fine/global-to-local weighting. Spectrum dominates early; graphlet
  # logits become the stronger discriminator near the clean end of the walk.
  global_to_local:
    schedule: cosine
    spectral_initial: 1.0
    spectral_final: 0.50
    graphlet_initial: 0.10
    graphlet_final: 1.25
    power: 1.5

  prediction_horizon:
    mode: annealed
    initial_k: 8
    final_k: 2
    schedule: cosine
    refresh_on_plateau: true

  debug:
    enabled: false
    print_every: 1
    top_candidates: 5
    spectrum_values: 12
    store_spectra: false

evaluation:
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
