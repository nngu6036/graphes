# HOG-Diff-inspired OU-bridge ablation for GraphER.
# This changes only the continuous summary training marginal; generation
# remains degree/typed-degree-constrained rewiring. Compare against the
# parent config ego_small_topology_spectral_graphlet_v2.yaml with identical seeds and generation budgets.

experiment: ego_small_topology_spectral_graphlet_v2
benchmark: ego_small
seed: 42

pipeline:
  stage: topology
  factorization: dhvae_hh_then_spectral_graphlet_diffusion_guided_degree_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: null
  tune_on_split: val
  final_split: test

dataset:
  name: ego
  benchmark: ego_small
  config_path: configs/datasets/ego_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null

# Every clean graph is paired only with an HH source endpoint having the
# same indexed degree sequence. No rewiring trajectory is constructed
# during training.
training_sources:
  mode: target_degree_havel_hakimi

# Connected induced graphlet classes define the local coordinates.
# Each graphlet order is augmented with a disconnected-subset bin,
# producing a complete probability simplex over induced k-node subsets.
graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: true
  clustering_bins: 20
  spectral_summary: false
  motif_proxy: false
  orbit_count: true

# Global spectral guidance.
spectral_prediction:
  require_same_degree_sequence: true
  distance: rmse
  normalization: mean_degree
  low_frequency_weight: 1.5
  low_frequency_cutoff: 6

# Local graphlet diffusion in CLR/logit space.
graphlet_diffusion:
  enabled: true
  representation: clr_logits
  include_disconnected_bin: true
  logit_epsilon: 0.0001
  distance: clr_rmse

  size_weights:
    "3": 1.5
    "4": 2.5
    "5": 0.75

# ---------------------------------------------------------------------------
# CONTINUOUS DIFFUSION TRAINING
# ---------------------------------------------------------------------------

# Predictor training follows a stochastic continuous bridge in summary space:
#
#   source summary -> noisy continuous summary -> clean summary
#
# No intermediate graph and no rewiring trajectory are constructed.
summary_diffusion:
  storage: streaming
  bridge: ou_bridge
  # HOG-Diff-inspired GOUB/OU marginal (Ego-small: N=200, cosine theta schedule).
  ou_num_scales: 200
  ou_schedule: cosine
  ou_eps: 0.005
  graphlet_bridge: brownian
  schedule: cosine
  power: 2.0

  spectral_sigma: 0.20
  preserve_spectral_trace: true
  fix_spectral_lambda1: true

  graphlet_sigma: 0.35

  samples_per_graph: 32
  paths_per_graph: 2

  time_sampling: stratified
  min_progress: 0.0
  max_progress: 1.0

  source_randomization_steps: 0
  random_relabel_source: true
  ensure_connected_source: true
  max_repair_trials: 10000

# ---------------------------------------------------------------------------
# JOINT SPECTRAL + GRAPHLET PREDICTOR
# ---------------------------------------------------------------------------

topology_predictor:
  type: spectral_graphlet_transformer

  checkpoint_path: outputs/topology_grapher/ego_small_spectral_graphlet_v2_hogdiff_ou/seed_42/checkpoint.pt
  device: auto

  hidden_dim: 256
  edge_dim: 128
  graph_dim: 256
  num_layers: 6

  spectral_dim: 256
  spectral_layers: 6
  spectral_heads: 8
  spectral_ff_dim: 1024

  graphlet_dim: 512
  graphlet_dropout: 0.03

  dropout: 0.05
  min_gap: 0.000001
  input_normalization: mean_degree

  batch_size: 4

  epochs: 800
  learning_rate: 0.0001
  weight_decay: 0.00005

  loss_weights:
    spectrum: 0.75
    moment2: 0.25

    low_frequency: 0.75
    low_frequency_k: 6

    graphlet_logit: 2.0
    graphlet_probability: 1.0

  progress_interval: 10

# ---------------------------------------------------------------------------
# DEGREE PRIOR
# ---------------------------------------------------------------------------

generation:
  degree_source: learned
  num_generate: 1024
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false

degree_generator:
  enabled: true
  type: degree_histogram_vae

  checkpoint_path: outputs/baselines/dhvae_hh/ego_small/seed_42/train/checkpoints/checkpoint.pt
  device: auto

  deterministic: false
  sample_num_nodes: empirical

  max_resample: 500
  parity_conditioned: true
  max_parity_resample: 64

  postprocess_policy: reject_only
  fallback: error

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

# ---------------------------------------------------------------------------
# GENERATION-TIME DEGREE-PRESERVING PROJECTION
# ---------------------------------------------------------------------------

topology_refiner:
  mode: spectral_graphlet

  steps: 256
  proposal_budget: 2048
  valid_candidate_budget: 512

  preserve_connectivity: true
  reject_revisited_states: true

  selection: greedy
  temperature: 0.1

  accept_only_improving: true

  min_improvement: 0.0000000001
  min_relative_improvement: 0.000001
  relative_improvement_epsilon: 0.000000000001

  spectral_guidance:
    distance: rmse
    normalization: mean_degree

    low_frequency_weight: 1.5
    low_frequency_cutoff: 6

    schedule: cosine

    min_clean_mix: 0.25
    max_clean_mix: 1.0
    power: 2.0

    expand_on_plateau: true
    plateau_expand_factor: 1.25
    max_plateau_expansions: 12

  graphlet_guidance:
    distance: clr_rmse
    logit_epsilon: 0.0001

    size_weights:
      "3": 1.5
      "4": 2.5
      "5": 0.75

    schedule: cosine

    min_clean_mix: 0.15
    max_clean_mix: 1.0
    power: 1.5

    plateau_expand_factor: 1.25

  # Spectrum dominates early; graphlet guidance dominates near the clean end.
  global_to_local:
    schedule: linear

    spectral_initial: 0.80
    spectral_final: 0.15

    graphlet_initial: 0.50
    graphlet_final: 3.00

    power: 1.0

  prediction_horizon:
    mode: annealed
    initial_k: 4
    final_k: 1
    schedule: cosine
    refresh_on_plateau: true

  debug:
    enabled: false
    print_every: 1
    top_candidates: 5
    spectrum_values: 12
    store_spectra: false

# ---------------------------------------------------------------------------
# EVALUATION
# ---------------------------------------------------------------------------

evaluation:
  inline_during_generation: false
  orca_exec: null

  compute_orbit: true
  compute_graphlet_history: true

  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true

  graphlet_backend: sampled
  graphlet_num_samples: 8192
