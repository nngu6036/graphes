# Joint typed-DH-VAE + symmetric SOFT bond-logit bridge. Atom labels are fixed.
# No-bond is category 0; bond categories follow categorical_state.edge_categories.
# Optional structural heads below describe untyped topology, not attributed graphlet counts.
# New family: uses its own checkpoints; old generic/attributed models remain unchanged.
experiment: qm9_joint_typed_edge
benchmark: qm9_heavy_atom
seed: 42
dataset:
  name: qm9_attributed
  config_path: configs/datasets/qm9.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: 2000
typed_signature:
  node_attribute: atomic_num
  node_categories:
  - 6
  - 7
  - 8
  - 9
  edge_attribute: bond_type
  edge_categories:
  - 1
  - 2
  - 3
  fields:
  - atomic_num
  - single_degree
  - double_degree
  - triple_degree
  hydrogens: implicit
  max_ordinary_degree: 4
  bond_orders:
    1: 1.0
    2: 2.0
    3: 3.0
  max_weighted_valence:
    6: 4.0
    7: 4.0
    8: 3.0
    9: 1.0
  size_mask: true
  domain_mask: true
constructor:
  type: typed_backtracking
  ensure_connected: true
  randomize_assignment: true
  max_restarts: 32
  max_backtracks: 50000
  candidate_ranking: uniform
  max_ordinary_degree: 4
  max_weighted_valence:
    6: 4.0
    7: 4.0
    8: 3.0
    9: 1.0
pipeline:
  stage: attributed
  factorization: joint_typed_vae_then_soft_edge_spectral_bridge_then_same_bond_rewiring
protocol:
  evaluation_seeds:
  - 42
  - 43
  - 44
  generated_graphs_per_seed: 64
  tune_on_split: val
  final_split: test
categorical_state:
  node_attribute: atomic_num
  node_categories:
  - 6
  - 7
  - 8
  - 9
  edge_attribute: bond_type
  edge_categories:
  - 1
  - 2
  - 3
degree_generator:
  enabled: true
  type: typed_degree_histogram_vae
  checkpoint_path: null
joint_typed_degree:
  enabled: true
  initialize_degree_checkpoint: outputs/degree_generators/qm9_typed/seed_42/checkpoint.pt
  trainable: true
  freeze_epochs: 10
  learning_rate: 2.0e-05
  loss_weight: 0.01
  kl_loss_weight: 0.005
  latent_dim: 64
  hidden_dim: 256
  size_condition_dim: 32
  prior_type: conditional_gmm
  prior_components: 8
  num_layers: 3
  dropout: 0.0
  loss_weights:
    num_nodes: 1.0
    signature: 5.0
    incidence: 0.1
attributed_predictor:
  type: joint_typed_soft_edge
  checkpoint_path: outputs/attributed_grapher/qm9_joint_typed_edge/seed_42/checkpoint.pt
  device: auto
  hidden_dim: 128
  num_layers: 4
  spectral_layers: 2
  spectral_heads: 4
  epochs: 100
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  grad_clip: 1.0
  loss_weights:
    edge_ce: 1.0
    edge_logit: 0.1
    typed_consistency: 0.1
    spectrum: 0.5
    clustering_histogram: 0.25
    orbit_summary: 0.5
  batch_progress_interval: 50
  progress_interval_seconds: 60
edge_diffusion:
  enabled: true
  bridge: centered_logit_brownian
  smoothing: 0.01
  sigma: 1.0
  spectral_enabled: true
  spectral_sigma: 0.15
  endpoint_fraction: 0.1
  views_per_graph: 2
  sampling_steps: 32
  generation_strategy: bridge_then_rewire
structure_summary_prediction:
  clustering_histogram: true
  clustering_bins: 100
  orbit_summary: true
  orbit_width: 15
  cycle_graphlet_histogram: false
training_sources:
  mode: target_indexed_typed_constructor
  shared_relabel_augmentation: true
  memory_cache_graphs: 256
  endpoint_cache_path: outputs/cache/qm9_joint_typed_edge/endpoints.sqlite
source_enrichment:
  enabled: false
generation:
  invariant_source: learned
  sample_num_nodes: empirical
  num_generate: 64
  max_attempts_per_graph: 128
  max_invariant_resample: 1000
  require_rdkit_source_validity: true
  checkpoint_every: 16
attributed_refiner:
  steps: 32
  proposal_budget: 1024
  valid_candidate_budget: 256
  strict_same_bond: true
  preserve_connectivity: true
  rdkit_candidate_filter: true
  normalization: initial
  epsilon: 1.0e-06
  min_improvement: 1.0e-08
  weights:
    edge: 1.0
    clustering: 0.25
    orbit: 1.0
evaluation:
  reference_split: val
  metric_molecule_source: raw_valid
  nspdk_backend: eden
  require_fcd: true
