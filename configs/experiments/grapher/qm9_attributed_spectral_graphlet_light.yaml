experiment: qm9_attributed_spectral_graphlet_light
benchmark: qm9_heavy_atom
seed: 42

pipeline:
  stage: attributed
  factorization: typed_invariant_then_dual_spectral_attributed_graphlet_diffusion_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 256
  tune_on_split: val
  final_split: test

dataset:
  name: qm9_attributed
  config_path: configs/datasets/qm9.yaml
  root: outputs/datasets
  build_if_missing: false

  # Development budget for validating the attributed model design. Remove the
  # limits only after this light run trains and generates successfully.
  max_train_graphs: 2000
  max_val_graphs: 250
  max_generation_train_graphs: null

# The prepared heavy-atom QM9 split is expected to be kekulized. Training
# stops with a clear error if the observed bond support is not exactly 1/2/3.
categorical_state:
  node_attribute: atomic_num
  node_categories: [6, 7, 8, 9]
  edge_attribute: bond_type
  edge_categories: [1, 2, 3]
  require_exact_observed_support: true

# Connected attributed graphlets contain both atom and bond categories. The
# basis is fitted on training data only, with one unseen overflow class and one
# disconnected-subset coordinate for every order.
graphlet_prediction:
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_connected_only: true
  attributed: true
  attributed_backend: python
  graphlet_num_samples: null
  max_basis_graphs: 2000
  clustering_summary: false
  spectral_summary: false
  motif_proxy: false
  orbit_count: false

graphlet_diffusion:
  representation: clr_logits
  logit_epsilon: 0.0001

# Training uses a continuous stochastic bridge between the typed source and
# clean molecule summaries. No edge rewiring is used to create training states.
summary_diffusion:
  storage: eager
  bridge: brownian_endpoint_conditioned
  schedule: cosine
  power: 2.0
  spectral_sigma: 0.18
  graphlet_sigma: 0.30
  preserve_spectral_trace: true
  fix_spectral_lambda1: true
  samples_per_graph: 4
  paths_per_graph: 1
  time_sampling: stratified

# Global guidance uses both the ordinary topology Laplacian spectrum and a
# bond-order-weighted Laplacian spectrum.
spectral_prediction:
  normalization: mean_degree
  distance: rmse
  channel_weights:
    topology: 1.0
    bond_weighted: 1.0
  low_frequency_weight: 1.5
  low_frequency_cutoff: 4

# For each clean training molecule, build a connected source with the exact
# same indexed atom type and per-bond-type degree. This constructor is used only
# to define the bridge endpoint; intermediate training states remain continuous.
training_sources:
  mode: target_typed_degree_constructor
  ensure_connected_source: true
  max_repair_trials: 50000
  shared_relabel_augmentation: true
  typed_constructor:
    type: typed_backtracking
    ensure_connected: true
    randomize_assignment: false
    max_restarts: 32
    max_backtracks: 50000
    candidate_ranking: uniform
    max_ordinary_degree: 4
    max_weighted_valence:
      6: 4.0
      # Canonical QM9 projects formal charge from the categorical state.
      # These limits retain the corresponding N(+1)/O(+1) graph states.
      7: 4.0
      8: 3.0
      9: 1.0

attributed_predictor:
  type: attributed_spectral_graphlet_transformer
  checkpoint_path: outputs/attributed_grapher/qm9_spectral_graphlet_light/seed_42/checkpoint.pt
  device: auto

  hidden_dim: 192
  edge_dim: 96
  graph_dim: 192
  num_layers: 4

  spectral_dim: 192
  spectral_layers: 4
  spectral_heads: 6
  spectral_ff_dim: 768

  graphlet_dim: 384
  dropout: 0.05
  graphlet_dropout: 0.05
  min_gap: 0.000001
  input_normalization: mean_degree

  batch_size: 64
  epochs: 80
  learning_rate: 0.0002
  weight_decay: 0.00005
  progress_interval: 5

  loss_weights:
    spectrum: 1.0
    topology_spectrum: 1.0
    bond_spectrum: 1.0
    moment2: 0.25
    low_frequency: 0.5
    low_frequency_k: 4
    graphlet_logit: 1.5
    graphlet_probability: 0.5

# The first controlled experiment samples typed invariants empirically from the
# training split, isolating the new diffusion+rewiring model from typed-VAE
# error. Change invariant_source to learned for the full end-to-end generator.
generation:
  invariant_source: empirical
  num_generate: 256
  max_attempts_per_graph: 32
  checkpoint_every: 25
  store_traces: true

  # Keep both false for an unbiased raw-validity measurement. The report still
  # records source and final RDKit validity separately.
  require_rdkit_source_validity: false
  require_rdkit_final_validity: false

degree_generator:
  enabled: false
  type: typed_degree_histogram_vae
  checkpoint_path: outputs/degree_generators/qm9_typed/seed_42/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  max_resample: 1000
  fallback: error

constructor:
  type: typed_backtracking
  ensure_connected: true
  randomize_assignment: true
  max_restarts: 128
  max_backtracks: 50000
  candidate_ranking: uniform
  max_ordinary_degree: 4
  max_weighted_valence:
    6: 4.0
    7: 4.0
    8: 3.0
    9: 1.0

# During generation, the continuous reverse-summary target is projected into
# graph space using only valid same-bond-type double-edge swaps. Each accepted
# move preserves atom types, indexed per-bond-type degrees, ordinary degrees,
# global bond counts, and weighted valence.
attributed_refiner:
  mode: attributed_spectral_graphlet
  steps: 32
  proposal_budget: 256
  valid_candidate_budget: 64
  preserve_connectivity: true
  reject_revisited_states: true
  return_best_state: false
  selection: greedy
  temperature: 0.1
  min_improvement: 0.000000001
  min_relative_improvement: 0.000001
  relative_improvement_epsilon: 0.000000000001

  spectral_guidance:
    distance: rmse
    normalization: mean_degree
    channel_weights:
      topology: 1.0
      bond_weighted: 1.0
    low_frequency_weight: 1.5
    low_frequency_cutoff: 4
    schedule: cosine
    min_clean_mix: 0.10
    max_clean_mix: 1.0
    power: 2.0

  graphlet_guidance:
    distance: clr_rmse
    logit_epsilon: 0.0001
    size_weights:
      "3": 1.5
      "4": 2.5
    schedule: cosine
    min_clean_mix: 0.05
    max_clean_mix: 1.0
    power: 2.0

  expand_on_plateau: true
  plateau_expand_factor: 1.35
  max_plateau_expansions: 6

  global_to_local:
    schedule: cosine
    spectral_initial: 1.0
    spectral_final: 0.35
    graphlet_initial: 0.20
    graphlet_final: 1.75
    power: 1.5

  prediction_horizon:
    mode: annealed
    initial_k: 4
    final_k: 1
    schedule: cosine
    refresh_on_plateau: true

  molecular:
    require_same_edge_type_pair: true
    preserve_removed_edge_type: true
    enforce_molecular_valence: true
    allowed_bond_types: [1, 2, 3]
    max_valence:
      6: 4.0
      7: 4.0
      8: 3.0
      9: 1.0

    # Cheap invariant/valence/summary checks run first. RDKit is applied only
    # to the top combined-energy shortlist.
    rdkit_candidate_check: true
    rdkit_infer_projected_formal_charges: true
    rdkit_shortlist: 8
    require_rdkit_source_validity: false

  debug:
    enabled: false
    print_every: 1
    top_candidates: 5

evaluation:
  generated_graphs: molecular_graphs.pkl
  validity_without_correction: true
  uniqueness: true
  novelty: true
  nspdk: true
  fcd: optional
