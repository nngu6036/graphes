experiment: community_small_defog_corrector
benchmark: community_small
seed: 42

pipeline:
  stage: posthoc_correction
  factorization: frozen_defog_base_then_structural_summary_correction

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: 20
  tune_on_split: val
  final_split: test
  reuse_identical_base_samples: true

dataset:
  # GraphER's held-out evaluation split. This historical dataset alias is
  # distinct from DeFoG's explicit `comm20` configuration name below.
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false

generation:
  num_generate: 1024
  # The current GraphER refiner accepts connected inputs only. Retaining a
  # disconnected DeFoG sample unchanged preserves paired sample count and its
  # generated graph-size/degree distribution.
  disconnected_policy: no_op_and_report

base_generator:
  type: defog
  backend: subprocess
  source_env: DEFOG
  python_env: DEFOG_PYTHON

  # Community-small uses DeFoG's comm20 profile. Ego-small may reuse this
  # data-driven profile with its benchmark identity recorded separately; Grid
  # has no declared compatibility profile. QM9 and ZINC use native profiles.
  dataset: comm20
  experiment: comm20
  checkpoint_path: outputs/baselines/defog/community_small/seed_42/train/checkpoints/model.ckpt

  # Set this to a trusted DeFoG .pkl or a previously exported neutral .npz to
  # reuse exactly the same base samples for correction ablations.
  generated_path: null
  manifest_path: null

  sampling:
    batch_size: 64
    sample_steps: 1000
    eta: 0.0
    omega: 0.0
    time_distortion: identity
    rdb: general
    rdb_crit: dummy

  runtime:
    device: auto
    python_executable: null
    cuda_visible_devices: null
    timeout_seconds: 21600

  dataset_contract:
    split_alignment: unverified
    note: >-
      A released DeFoG comm20 checkpoint uses its own SPECTRE split. Do not
      claim identical training data unless DeFoG was retrained on GraphER's
      frozen Community-small split.

degree_generator:
  enabled: false

constructor:
  enabled: false

topology_predictor:
  checkpoint_path: outputs/topology_grapher/community_small_defog/seed_42/checkpoint.pt
  device: auto

topology_refiner:
  mode: energy
  steps: 8
  proposal_budget: 256
  valid_candidate_budget: 64
  preserve_connectivity: true
  selection: greedy
  temperature: 0.1
  graphlet_weight: 1.0
  graphlet_mass_weight: 0.0
  clustering_weight: 1.0
  orbit_weight: 1.0
  accept_only_improving: true
  min_improvement: 0.00000001
  sample_graphlet: false
  refresh_prediction_every: 1
  reject_revisited_states: true

evaluation:
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
