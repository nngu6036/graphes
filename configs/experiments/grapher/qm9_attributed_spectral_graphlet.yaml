experiment: qm9_attributed_spectral_graphlet_final
benchmark: qm9_heavy_atom
seed: 42

pipeline:
  stage: attributed
  factorization: typed_invariant_then_dual_spectral_attributed_graphlet_diffusion_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  tune_on_split: val
  final_split: test

dataset:
  name: qm9_attributed
  config_path: configs/datasets/qm9.yaml
  root: outputs/datasets
  build_if_missing: false

  # Final experiment: use the complete training split.
  max_train_graphs: null

  # Validation is capped only to keep per-epoch validation affordable.
  # It is still drawn exclusively from the declared validation split.
  max_val_graphs: 2000

  # All training graphs remain available when empirical information is needed
  # during generation/evaluation.
  max_generation_train_graphs: null

categorical_state:
  node_attribute: atomic_num
  node_categories: [6, 7, 8, 9]

  edge_attribute: bond_type
  edge_categories: [1, 2, 3]

  # QM9 is expected to use the kekulized heavy-atom representation.
  require_exact_observed_support: true


# ---------------------------------------------------------------------------
# ATTRIBUTED GRAPHLETS
# ---------------------------------------------------------------------------

# Local structural guidance.
#
# k=3 and k=4 are retained for the final QM9 model:
#   - k=3 captures triangles / short local interactions,
#   - k=4 aligns especially well with the standard orbit evaluation,
#   - k=5 is omitted because the attributed vocabulary grows rapidly and
#     gives a much worse compute/benefit ratio for QM9.
graphlet_prediction:
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_connected_only: true

  attributed: true
  attributed_backend: python
  graphlet_num_samples: null

  # A reasonably large training-only subset is sufficient to establish the
  # QM9 attributed graphlet vocabulary while keeping preprocessing practical.
  # Unseen classes are represented by the overflow coordinate.
  max_basis_graphs: 20000

  clustering_summary: false
  spectral_summary: false
  motif_proxy: false
  orbit_count: false

graphlet_diffusion:
  representation: clr_logits

  # Prevent zero / extremely rare attributed graphlets from producing
  # numerically extreme CLR coordinates.
  logit_epsilon: 0.0001


# ---------------------------------------------------------------------------
# CONTINUOUS SUMMARY DIFFUSION
# ---------------------------------------------------------------------------

# IMPORTANT:
#
# Training DOES NOT construct a rewiring trajectory.
#
# For each clean graph G_0 and its same-typed-invariant source G_T:
#
#   Z_T -> continuous stochastic bridge state Z_t -> Z_0
#
# Rewiring is used only at generation time to project each reverse-diffusion
# summary target into the discrete typed-degree-constrained graph space.
summary_diffusion:
  storage: streaming

  bridge: brownian_endpoint_conditioned
  schedule: cosine
  power: 2.0

  # Spectrum is comparatively stable, so use lower stochastic variance.
  spectral_sigma: 0.18

  # Graphlet CLR coordinates receive slightly more diffusion noise.
  graphlet_sigma: 0.30

  preserve_spectral_trace: true
  fix_spectral_lambda1: true

  # With the full QM9 training split, one fresh stochastic state per molecule
  # per epoch already provides very large training-state diversity.
  samples_per_graph: 1
  paths_per_graph: 1

  time_sampling: stratified


# ---------------------------------------------------------------------------
# GLOBAL SPECTRAL GUIDANCE
# ---------------------------------------------------------------------------

# Two spectral channels are learned jointly:
#
#   1. unweighted topology Laplacian
#   2. bond-order-weighted Laplacian
#
# They provide complementary global structural and chemical-topological cues.
spectral_prediction:
  normalization: mean_degree
  distance: rmse

  channel_weights:
    topology: 1.0
    bond_weighted: 1.25

  # Low-frequency components receive extra emphasis because they carry
  # global / mesoscopic organization.
  low_frequency_weight: 1.5
  low_frequency_cutoff: 4


# ---------------------------------------------------------------------------
# TRAINING SOURCE
# ---------------------------------------------------------------------------

# The source endpoint for each training molecule has exactly the same
# indexed atom type and per-bond-type degree as the clean target.
#
# The constructor is used ONLY for the endpoint. It does not generate
# intermediate training states.
training_sources:
  mode: target_typed_degree_constructor

  ensure_connected_source: true
  max_repair_trials: 50000
  shared_relabel_augmentation: true

  typed_constructor:
    type: typed_backtracking
    ensure_connected: true

    # Keep the indexed typed invariant aligned with the clean graph.
    randomize_assignment: false

    max_restarts: 64
    max_backtracks: 100000
    candidate_ranking: uniform

    max_ordinary_degree: 4

    max_weighted_valence:
      6: 4.0
      # Canonical QM9 projects formal charge from the categorical state.
      # Retain the corresponding N(+1)/O(+1) graph states.
      7: 4.0
      8: 3.0
      9: 1.0


# ---------------------------------------------------------------------------
# JOINT ATTRIBUTED PREDICTOR
# ---------------------------------------------------------------------------

attributed_predictor:
  type: attributed_spectral_graphlet_transformer

  checkpoint_path: outputs/attributed_grapher/qm9_spectral_graphlet/seed_42/checkpoint.pt
  device: auto

  # Graph / typed-invariant encoder.
  hidden_dim: 256
  edge_dim: 128
  graph_dim: 256
  num_layers: 6

  # Variable-length dual-spectrum transformer.
  spectral_dim: 256
  spectral_layers: 6
  spectral_heads: 8
  spectral_ff_dim: 1024

  # Attributed graphlet-logit branch.
  graphlet_dim: 512

  dropout: 0.05
  graphlet_dropout: 0.05
  min_gap: 0.000001
  input_normalization: mean_degree

  # QM9 graphs are small, so a large batch is practical.
  batch_size: 128

  # Full QM9 gives far more examples per epoch than the development config.
  # 30 epochs is already substantially more optimization exposure than the
  # 2000-graph / 80-epoch light configuration.
  epochs: 30

  learning_rate: 0.00015
  weight_decay: 0.00005

  progress_interval: 1

  loss_weights:
    # Joint full-spectrum reconstruction.
    spectrum: 1.0

    topology_spectrum: 1.0
    bond_spectrum: 1.25

    # The second moment is partly constrained by the invariant, therefore
    # retain it only as a weak consistency regularizer.
    moment2: 0.20

    low_frequency: 0.75
    low_frequency_k: 4

    # Strong local supervision because generic experiments showed that
    # graphlet guidance supplied the major additional gain over spectrum alone.
    graphlet_logit: 2.0
    graphlet_probability: 0.75


# ---------------------------------------------------------------------------
# END-TO-END UNCONDITIONAL GENERATION
# ---------------------------------------------------------------------------

generation:
  # Final paper model uses the learned typed-invariant prior.
  invariant_source: learned

  num_generate: 1024
  max_attempts_per_graph: 64

  # Permit partial evaluation while the full generation job is running.
  checkpoint_every: 25
  store_traces: true

  # Source must be a chemically valid molecule before refinement.
  #
  # This is part of the generative constraint mechanism, not post-hoc repair.
  require_rdkit_source_validity: true

  # Do not filter final serialized samples after generation. Candidate-level
  # validity is handled inside the refiner and the evaluator measures the
  # resulting raw validity.
  require_rdkit_final_validity: false


# ---------------------------------------------------------------------------
# LEARNED TYPED-DEGREE PRIOR
# ---------------------------------------------------------------------------

degree_generator:
  enabled: true
  type: typed_degree_histogram_vae

  checkpoint_path: outputs/degree_generators/qm9_typed/seed_42/checkpoint.pt
  device: auto

  deterministic: false
  sample_num_nodes: empirical

  max_resample: 2000
  fallback: error


# ---------------------------------------------------------------------------
# TYPED SOURCE CONSTRUCTOR
# ---------------------------------------------------------------------------

constructor:
  type: typed_backtracking
  ensure_connected: true
  randomize_assignment: true

  max_restarts: 256
  max_backtracks: 100000

  candidate_ranking: uniform

  max_ordinary_degree: 4

  max_weighted_valence:
    6: 4.0
    7: 4.0
    8: 3.0
    9: 1.0


# ---------------------------------------------------------------------------
# ATTRIBUTED SPECTRAL + GRAPHLET REWIRING
# ---------------------------------------------------------------------------

attributed_refiner:
  mode: attributed_spectral_graphlet

  # Larger than the development run, but still appropriate for tiny QM9
  # graphs. Most graphs will stop much earlier when no useful swap remains.
  steps: 64

  proposal_budget: 512
  valid_candidate_budget: 128

  preserve_connectivity: true
  reject_revisited_states: true

  # Keep the best state seen along the projected reverse trajectory.
  return_best_state: true

  selection: greedy
  temperature: 0.1

  min_improvement: 0.0000000001
  min_relative_improvement: 0.000001
  relative_improvement_epsilon: 0.000000000001


  # -------------------------------------------------------------------------
  # GLOBAL SPECTRAL TARGET
  # -------------------------------------------------------------------------

  spectral_guidance:
    distance: rmse
    normalization: mean_degree

    channel_weights:
      topology: 1.0
      bond_weighted: 1.25

    low_frequency_weight: 1.5
    low_frequency_cutoff: 4

    schedule: cosine

    # Do not jump immediately to the predicted clean spectrum.
    min_clean_mix: 0.10
    max_clean_mix: 1.0
    power: 2.0


  # -------------------------------------------------------------------------
  # LOCAL ATTRIBUTED-GRAPHLET TARGET
  # -------------------------------------------------------------------------

  graphlet_guidance:
    distance: clr_rmse
    logit_epsilon: 0.0001

    # k=3 supports short local chemistry; k=4 is emphasized because it
    # captures richer local arrangements and aligns with four-node orbits.
    size_weights:
      "3": 1.5
      "4": 2.5

    schedule: cosine

    min_clean_mix: 0.05
    max_clean_mix: 1.0
    power: 2.0


  # -------------------------------------------------------------------------
  # PLATEAU HANDLING
  # -------------------------------------------------------------------------

  expand_on_plateau: true

  # Expand gradually rather than jumping rapidly toward the terminal target.
  plateau_expand_factor: 1.25
  max_plateau_expansions: 8


  # -------------------------------------------------------------------------
  # GLOBAL -> LOCAL CURRICULUM
  # -------------------------------------------------------------------------

  global_to_local:
    schedule: cosine

    # Early reverse process:
    #   spectrum dominates.
    spectral_initial: 1.00
    graphlet_initial: 0.25

    # Near the clean endpoint:
    #   attributed graphlet guidance dominates.
    spectral_final: 0.30
    graphlet_final: 2.25

    power: 1.5


  # -------------------------------------------------------------------------
  # PREDICTION REFRESH
  # -------------------------------------------------------------------------

  # Several rewiring operations may realize one denoising direction early,
  # while near the clean endpoint predictions are refreshed every accepted
  # move.
  prediction_horizon:
    mode: annealed
    initial_k: 4
    final_k: 1
    schedule: cosine
    refresh_on_plateau: true


  # -------------------------------------------------------------------------
  # MOLECULAR CONSTRAINTS
  # -------------------------------------------------------------------------

  molecular:
    # Only swap two bonds having the same bond category.
    require_same_edge_type_pair: true
    preserve_removed_edge_type: true

    enforce_molecular_valence: true

    allowed_bond_types: [1, 2, 3]

    max_valence:
      6: 4.0
      7: 4.0
      8: 3.0
      9: 1.0

    # Apply all cheap typed-invariant / valence / structural scoring first.
    # RDKit is evaluated only on the highest-ranked candidates.
    rdkit_candidate_check: true
    rdkit_infer_projected_formal_charges: true
    rdkit_shortlist: 16

    # generation.require_rdkit_source_validity already guarantees this, but
    # retain the internal assertion as a consistency check.
    require_rdkit_source_validity: true


  debug:
    enabled: false
    print_every: 1
    top_candidates: 5


# ---------------------------------------------------------------------------
# EVALUATION
# ---------------------------------------------------------------------------

evaluation:
  generated_graphs: molecular_graphs.pkl

  validity: true
  validity_with_correction: true
  validity_without_correction: true

  uniqueness: true
  novelty: true

  nspdk: true
  fcd: true
