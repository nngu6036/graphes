experiment: community_small_topology_graphlet
benchmark: community_small
seed: 42

pipeline:
  stage: topology
  factorization: degree_prior_then_graphlet_rewiring

protocol:
  evaluation_seeds: [42, 43, 44]
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: 20
  tune_on_split: val
  final_split: test

dataset:
  # Community-small retains the historical serialized dataset name `sbm`.
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null

graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  # Connected topology graphlets are enumerated exactly; candidate scores use
  # exact local deltas around the four switch endpoints.
  graphlet_num_samples: null
  clustering_summary: false
  spectral_summary: false
  motif_proxy: false
  orbit_count: false

# The teacher sees the target degree sequence and target graphlet histogram,
# never the terminal adjacency. It proposes ordinary valid swaps and follows
# graphlet-improving actions inside the fixed degree fibre.
topology_trajectory:
  # Only selected sparse NetworkX states are retained; candidates are scored
  # and discarded, so eager caching avoids rebuilding teachers every epoch.
  storage: eager
  steps: 12
  proposal_budget: 96
  valid_candidate_budget: 24
  states_per_graph: 4
  paths_per_graph: 1
  source_randomization_steps: 4
  random_relabel_source: true
  teacher_mode: soft
  teacher_temperature: 0.25
  teacher_top_k: 4
  teacher_sample_actions: true
  teacher_graphlet_mass_weight: 0.0
  teacher_min_improvement: 0.00000001
  target_tolerance: 0.0
  preserve_connectivity: true
  ensure_connected_source: true
  max_repair_trials: 10000

topology_predictor:
  checkpoint_path: outputs/topology_grapher/community_small/seed_42/checkpoint.pt
  device: auto
  hidden_dim: 128
  edge_dim: 64
  graph_dim: 128
  num_layers: 4
  dropout: 0.0
  min_concentration: 0.05
  max_concentration: 50.0
  batch_size: 4
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  target_epsilon: 0.00001
  loss_weights:
    graphlet_mean: 1.0
    graphlet_distribution: 0.1
    graphlet_mass: 0.0
  progress_interval: 5

generation:
  degree_source: learned
  num_generate: 1024
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/sbm/seed_42/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  max_resample: 500
  parity_conditioned: true
  max_parity_resample: 64
  postprocess_policy: reject_only
  fallback: error

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

topology_refiner:
  mode: energy
  steps: 24
  proposal_budget: 128
  valid_candidate_budget: 32
  preserve_connectivity: true
  selection: greedy
  temperature: 0.1
  graphlet_weight: 1.0
  graphlet_mass_weight: 0.0
  accept_only_improving: true
  min_improvement: 0.00000001
  sample_graphlet: false
  refresh_prediction_every: 1
  reject_revisited_states: true

evaluation:
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
