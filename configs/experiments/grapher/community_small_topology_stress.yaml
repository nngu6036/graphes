experiment: community_small_topology_stress
base_config: configs/experiments/grapher/community_small_topology_graphlet.yaml
output_root: outputs/stress/topology/community_small

# Use seed 42 while choosing the compute regime. Refit and confirm only the
# selected regime with all three seeds.
development_seeds: [42]
confirmation_seeds: [42, 43, 44]

# These sources use validation-graph degree sequences only. The target
# adjacency is never passed to the constructor, predictor, or refiner. The
# serialized sources are reused byte-for-byte across all variants.
fixed_sources:
  cache_name: fixed_val_sources.pkl
  source_seed: 20260812
  replicates: 1
  source_randomization_steps: 0
  constructor_overrides:
    type: havel_hakimi
    ensure_connected: true
    random_relabel: true
    max_repair_trials: 10000

evaluation:
  reference_split: val
  refinement_seed: 20260813
  compute_orbit: true
  orca_exec: null
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 5
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
  # Degree MMD is intentionally excluded because every variant shares the same
  # source graphs and rewiring preserves every degree exactly.
  selection_metrics:
    - clustering_mmd
    - orbit_mmd
    - graphlet_history_mmd

# Phase 1: isolate finite candidate search using the existing predictor.
inference_budget:
  checkpoint: outputs/topology_grapher/community_small/seed_{seed}/checkpoint.pt
  variants:
    - name: s0_current
      refiner:
        steps: 24
        proposal_budget: 128
        valid_candidate_budget: 32
    - name: s1_balanced
      refiner:
        steps: 48
        proposal_budget: 256
        valid_candidate_budget: 64
    - name: s2_stress
      refiner:
        steps: 80
        proposal_budget: 512
        valid_candidate_budget: 128
        # Candidate-width sweep at fixed T=80.
    - name: width128_t80
      refiner:
        steps: 80
        proposal_budget: 128
        valid_candidate_budget: 32

    - name: width256_t80
      refiner:
        steps: 80
        proposal_budget: 256
        valid_candidate_budget: 64

    # Step/time-conditioning sweep at fixed B=512, K=128.
    - name: width512_t24
      refiner:
        steps: 24
        proposal_budget: 512
        valid_candidate_budget: 128

    - name: width512_t48
      refiner:
        steps: 48
        proposal_budget: 512
        valid_candidate_budget: 128

# Reusable enhanced trajectory settings. Streaming regenerates the training
# path each epoch while validation always uses its fixed epoch-0 trajectories.
_enhanced_trajectory: &enhanced_trajectory
  storage: streaming
  steps: 24
  proposal_budget: 192
  valid_candidate_budget: 48
  states_per_graph: 8
  paths_per_graph: 1
  source_randomization_steps: 8
  random_relabel_source: true
  teacher_mode: soft
  teacher_temperature: 0.25
  teacher_top_k: 4
  teacher_sample_actions: true
  teacher_graphlet_mass_weight: 0.0
  teacher_min_improvement: 0.00000001
  target_tolerance: 0.0
  preserve_connectivity: true
  ensure_connected_source: true
  max_repair_trials: 10000

# Phase 2: isolate cached-vs-fresh trajectories and optimizer-update budget.
training_budget:
  shared_overrides:
    degree_generator:
      checkpoint_path: outputs/degree_generators/sbm/seed_{seed}/checkpoint.pt
  evaluation_refiner:
    steps: 48
    proposal_budget: 256
    valid_candidate_budget: 64
  variants:
    - name: baseline_eager_e50
      overrides:
        topology_trajectory:
          storage: eager
          steps: 12
          proposal_budget: 96
          valid_candidate_budget: 24
          states_per_graph: 4
          paths_per_graph: 1
          source_randomization_steps: 4
        topology_predictor:
          epochs: 50
          batch_size: 4
    # This changes only eager -> streaming, so it isolates the value of fresh
    # trajectories before the teacher horizon and retained states are enlarged.
    - name: streaming_base_e50
      overrides:
        topology_trajectory:
          storage: streaming
          steps: 12
          proposal_budget: 96
          valid_candidate_budget: 24
          states_per_graph: 4
          paths_per_graph: 1
          source_randomization_steps: 4
        topology_predictor:
          epochs: 50
          batch_size: 4
    - name: streaming_e50
      overrides:
        topology_trajectory: *enhanced_trajectory
        topology_predictor:
          epochs: 50
          batch_size: 8
    - name: streaming_e100
      overrides:
        topology_trajectory: *enhanced_trajectory
        topology_predictor:
          epochs: 100
          batch_size: 8
    - name: streaming_e200
      overrides:
        topology_trajectory: *enhanced_trajectory
        topology_predictor:
          epochs: 200
          batch_size: 8
    # Run this only if the epoch-200 validation curve is still improving.
    - name: streaming_e400
      enabled: false
      overrides:
        topology_trajectory: *enhanced_trajectory
        topology_predictor:
          epochs: 400
          batch_size: 8

# Phase 3a (optional): model capacity after choosing the training budget.
capacity:
  enabled: false
  shared_overrides:
    degree_generator:
      checkpoint_path: outputs/degree_generators/sbm/seed_{seed}/checkpoint.pt
    topology_trajectory: *enhanced_trajectory
    topology_predictor:
      epochs: 200
      batch_size: 8
  evaluation_refiner:
    steps: 48
    proposal_budget: 256
    valid_candidate_budget: 64
  variants:
    - name: c128_l4
      overrides:
        topology_predictor:
          hidden_dim: 128
          edge_dim: 64
          graph_dim: 128
          num_layers: 4
    - name: c256_l6
      overrides:
        topology_predictor:
          hidden_dim: 256
          edge_dim: 128
          graph_dim: 256
          num_layers: 6

# Phase 3b (optional and last): graphlet order. Exact k=6 training and
# candidate scoring are substantially more expensive (112 additional classes).
graphlet_order:
  enabled: false
  shared_overrides:
    degree_generator:
      checkpoint_path: outputs/degree_generators/sbm/seed_{seed}/checkpoint.pt
    topology_trajectory: *enhanced_trajectory
    topology_predictor:
      epochs: 200
      batch_size: 8
  evaluation_refiner:
    steps: 48
    proposal_budget: 256
    valid_candidate_budget: 64
  variants:
    - name: k3_4
      overrides:
        graphlet_prediction:
          graphlet_k_min: 3
          graphlet_k_max: 4
    - name: k3_5
      overrides:
        graphlet_prediction:
          graphlet_k_min: 3
          graphlet_k_max: 5
    - name: k3_6
      overrides:
        graphlet_prediction:
          graphlet_k_min: 3
          graphlet_k_max: 6
