# Adds C3 (triangle) occurrence mass, not a degenerate cycle-only conditional distribution.
# Cycle loss/head is clean-target supervision only; no graphlet diffusion is enabled.
# Relative score weights C=0.25, O=1, cycle3=0.25 are an experimental starting point.
experiment: community_small_topology_spectral_clustering_orbit_cycle3
benchmark: community_small
seed: 42
pipeline:
  stage: topology
  factorization: dhvae_hh_then_spectral_diffusion_with_clustering_orbit_cycle3_prediction_and_rewiring
protocol:
  evaluation_seeds:
  - 42
  - 43
  - 44
  report_mean_and_std: true
  generated_graphs_per_seed: 64
  max_reference_graphs: null
  tune_on_split: val
  final_split: test
dataset:
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_val_graphs: null
training_sources:
  mode: target_degree_havel_hakimi
graphlet_prediction:
  estimator: exact_connected_local_delta
  graphlet_history: false
  graphlet_k_min: 3
  graphlet_k_max: 3
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: false
  spectral_summary: false
  motif_proxy: false
  orbit_count: false
structure_summary_prediction:
  clustering_coefficient: false
  clustering_histogram: true
  clustering_bins: 100
  orbit_summary: true
  orbit_width: 15
  cycle_graphlet_histogram: true
  cycle_graphlet_k: 3
spectral_prediction:
  require_same_degree_sequence: true
  distance: rmse
  normalization: mean_degree
  low_frequency_weight: 1.0
  low_frequency_cutoff: 0
summary_diffusion:
  storage: streaming
  bridge: brownian_endpoint_conditioned
  schedule: linear
  power: 1.0
  spectral_sigma: 0.2
  preserve_spectral_trace: true
  fix_spectral_lambda1: true
  samples_per_graph: 16
  paths_per_graph: 2
  time_sampling: stratified
  min_progress: 0.0
  max_progress: 1.0
  source_randomization_steps: 0
  random_relabel_source: true
  ensure_connected_source: true
  max_repair_trials: 10000
  cache_endpoints: true
topology_predictor:
  type: spectral_transformer
  checkpoint_path: outputs/topology_grapher/community_small_spectral_clustering_orbit_cycle3/seed_42/checkpoint.pt
  device: auto
  use_graph_context: false
  hidden_dim: 32
  edge_dim: 16
  graph_dim: 32
  num_layers: 1
  spectral_dim: 128
  spectral_layers: 3
  spectral_heads: 4
  spectral_ff_dim: 256
  dropout: 0.0
  min_gap: 1.0e-06
  input_normalization: mean_degree
  batch_size: 8
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  loss_weights:
    spectrum: 1.0
    moment2: 0.0
    low_frequency: 0.0
    low_frequency_k: 0
    clustering_coefficient: 0.0
    clustering_histogram: 1.0
    clustering_histogram_ce: 0.0
    orbit_summary: 1.0
    cycle_graphlet_histogram: 1.0
    cycle_graphlet_histogram_ce: 0.0
  progress_interval: 5
generation:
  degree_source: train_empirical
  num_generate: 64
  max_attempts_per_graph: 8
  write_legacy_hybrid_alias: false
degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/sbm/seed_42/checkpoint.pt
  device: auto
  deterministic: false
  sample_num_nodes: empirical
  sample_num_edges: model
  exact_degree_sum_conditioning: true
  max_resample: 500
  model_resample_attempts: 32
  parity_conditioned: false
  max_parity_resample: 1
  postprocess_policy: reject_only
  fallback: error
constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000
source_enrichment:
  enabled: false
topology_refiner:
  mode: spectral
  guidance_mode: clustering_orbit_cycle
  steps: 32
  proposal_budget: 1024
  valid_candidate_budget: 256
  preserve_connectivity: true
  reject_revisited_states: true
  selection: greedy
  temperature: 0.1
  accept_only_improving: true
  min_improvement: 1.0e-10
  min_relative_improvement: 0.0
  relative_improvement_epsilon: 1.0e-06
  spectral_guidance:
    weight: 0.0
    distance: rmse
    normalization: mean_degree
    low_frequency_weight: 1.0
    low_frequency_cutoff: 0
    schedule: linear
    min_clean_mix: 1.0
    max_clean_mix: 1.0
    power: 1.0
    expand_on_plateau: false
    plateau_expand_factor: 1.0
    max_plateau_expansions: 0
    allow_sideways_moves: false
  clustering_guidance:
    statistic: histogram
    histogram_bins: 100
    distance: wasserstein1
    weight: 0.25
  orbit_guidance:
    distance: log_rmse
    weight: 1.0
  prediction_horizon:
    mode: fixed
    k: 1
    refresh_on_plateau: false
  candidate_search:
    adaptive: false
    compute_spectral_diagnostics: false
    spectrum_backend: auto
    spectrum_batch_size: 256
  debug:
    enabled: false
    print_every: 1
    top_candidates: 5
    spectrum_values: 16
    store_spectra: false
  cycle_guidance:
    k: 3
    distance: total_variation
    weight: 0.25
evaluation:
  reference_split: val
  inline_during_generation: false
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: false
  graphlet_k_min: 3
  graphlet_k_max: 3
  graphlet_connected_only: true
  graphlet_backend: sampled
  graphlet_num_samples: 8192
  generic_mmd_protocol: graphrnn
  generic_clustering_bins: 100
