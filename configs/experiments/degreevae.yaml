seed: 42

summary:
  degree_hist_max_degree: auto

constructor:
  ensure_connected: true

degree_generator:
  epochs: 300
  batch_size: 32
  latent_dim: 32
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0
  learning_rate: 0.002
  weight_decay: 0.0
  kl_loss_weight: 0.005
  node_count_loss_weight: 1.0
  degree_histogram_loss_weight: 5.0
  edge_count_loss_weight: 0.1
