experiment: ego_small_degree_histogram_vae
benchmark: ego_small
seed: 42

dataset:
  name: ego_small
  benchmark: ego_small
  config_path: configs/datasets/ego_small.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null

summary:
  degree_hist_max_degree: auto

constructor:
  type: havel_hakimi
  ensure_connected: true

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/ego_small/seed_42/checkpoint.pt
  device: auto
  epochs: 600
  batch_size: 32
  latent_dim: 32
  hidden_dim: 128
  size_condition_dim: 16

  # V2: factor the invariant prior as p(n) p(m|n) p(D|n,m).  Graph size is
  # sampled empirically; an explicit learned edge-count head captures density;
  # the degree decoder and learned latent prior are then conditioned on n and m.
  use_edge_count_conditioning: true
  edge_condition_dim: 16
  prior_condition_on_edges: true
  edge_count_loss_weight: 2.0

  prior_type: conditional_gmm
  prior_components: 4
  prior_hidden_dim: 128
  prior_logvar_min: -6.0
  prior_logvar_max: 4.0
  num_layers: 2
  dropout: 0.0
  learning_rate: 0.002
  weight_decay: 0.00001
  kl_loss_weight: 0.005
  kl_warmup_epochs: 50
  node_count_loss_weight: 1.0
  degree_histogram_loss_weight: 5.0
  degree_moment_loss_weight: 0.25

  # Unconditional-prior regularization.  The RBF-MMD term matches decoded
  # prior degree histograms to the training distribution, while aggregate
  # latent moments reduce q(z) / p(z|n,m) mismatch.
  prior_distribution_loss_weight: 1.0
  prior_distribution_kernel_sigma: 0.20
  aggregate_prior_moment_loss_weight: 0.05
  progress_interval: 10

  deterministic: false
  sample_num_nodes: empirical
  sample_num_edges: model
  # Condition categorical degree draws on sum_i d_i = 2m exactly.  This makes
  # edge count and parity structural rather than repair-time constraints.
  exact_degree_sum_conditioning: true
  max_resample: 500
  parity_conditioned: false
  max_parity_resample: 1
  postprocess_policy: reject_only
  fallback: error

degree_evaluation:
  # Degree-only evaluation is cheap; use enough samples to resolve prior quality
  # before launching expensive GraphER refinement.
  num_samples: 10000
  max_reference_sequences: null
  batch_size: 256
  output_dir: outputs/degree_generators/ego_small/seed_42/evaluation
