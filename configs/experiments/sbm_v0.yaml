experiment: coarse_to_fine_sbm_v0
seed: 42

dataset:
  name: sbm_spectre
  config_path: configs/datasets/sbm_spectre.yaml
  root: outputs/datasets
  build_if_missing: true
  max_train_graphs: 64
  max_reference_graphs: 20

summary:
  degree_hist_max_degree: auto
  clustering_bins: 20
  spectral_bins: 20
  motif_proxy: true
  orbit_count: false

summary_generator:
  type: empirical
  split: train

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

refiner:
  steps: 3
  candidate_budget: 32
  k_hop: -1
  preserve_connectivity: true
  selection: greedy
  temperature: 0.05
  accept_only_improving: true
  min_improvement: 1.0e-12

energy:
  degree_weight: 0.0
  clustering_weight: 1.0
  spectral_weight: 0.0
  motif_weight: 0.5
  density_weight: 0.0
  triangle_weight: 0.2

evaluation:
  num_generate: 20
  random_rewire_baseline: true
  save_graphs: true
