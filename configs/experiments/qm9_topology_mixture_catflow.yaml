experiment: qm9_topology_first_mixture_catflow
seed: 42

# Stage 1: topology generator uses the same generic graph pipeline on stripped QM9 topology.
dataset:
  name: qm9_topology
  config_path: configs/datasets/qm9_topology.yaml
  root: outputs/datasets
  build_if_missing: false
  max_train_graphs: null
  max_reference_graphs: null

summary:
  degree_hist_max_degree: auto
  clustering_bins: 10
  spectral_bins: 10
  motif_proxy: true
  orbit_count: false

summary_generator:
  type: learned
  checkpoint_path: outputs/summary_generators/qm9_topology/checkpoint.pt
  device: cpu
  deterministic: false

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/qm9_topology/checkpoint.pt
  vectorizer_path: outputs/degree_generators/qm9_topology/degree_vectorizer.json
  device: cpu
  sample_num_nodes: empirical
  max_resample: 200
  require_graphical: true
  require_connected_feasible: true
  fallback: empirical_nearest_n

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

energy:
  degree_weight: 0.0
  density_weight: 0.0
  clustering_weight: 0.5
  spectral_weight: 0.5
  motif_weight: 0.5
  triangle_weight: 0.2
  orbit_weight: 0.0
  normalize_terms: true

teacher:
  type: energy_guided
  output_dir: outputs/teachers/qm9_topology
  num_trajectories: 512
  val_fraction: 0.1
  steps: 10
  candidate_budget: 32
  preserve_connectivity: true
  selection: soft
  temperature: 0.05
  accept_only_improving: true
  min_improvement: 1.0e-12
  target_source: mixed
  empirical_target_prob: 0.5
  learned_target_prob: 0.5

selector:
  type: graph_action_selector
  checkpoint_path: outputs/selectors/qm9_topology/checkpoint.pt
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1
  degree_width: 16
  clustering_width: 10
  spectral_width: 10
  motif_width: 5
  orbit_width: 15
  learning_rate: 0.0003
  batch_size: 64
  epochs: 100
  weight_decay: 0.00001
  device: cpu

refiner:
  type: learned_selector
  steps: 10
  candidate_budget: 32
  preserve_connectivity: true
  selection: greedy
  accept_only_improving: false
  temperature: 0.1

oracle_refiner:
  type: grapher_opt
  steps: 10
  candidate_budget: 32
  preserve_connectivity: true
  selection: greedy
  accept_only_improving: true
  min_improvement: 1.0e-12

evaluation:
  num_generate: 100
  random_rewire_baseline: true
  oracle_grapher_opt_baseline: true
  learned_selector: true
  save_graphs: true
  compute_orbit: false

# Stage 2: topology-conditioned attribute generation.
mixture_catflow:
  dataset:
    name: qm9_attributed
    root: outputs/datasets
  checkpoint_path: outputs/attribute_flows/qm9_mixture_catflow/checkpoint.pt
  device: cpu
  hidden_dim: 128
  edge_dim: 64
  num_layers: 4
  num_mixtures: 4
  dropout: 0.0
  learning_rate: 0.0003
  weight_decay: 0.00001
  batch_size: 64
  epochs: 100
  sampling_steps: 64
  temperature: 1.0
