# Same as mixture CatFlow, but num_mixtures=1. This is the CatFlow-style
# conditional attribute-flow ablation for Stage 2.
experiment: qm9_topology_first_catflow_stage2_ablation
seed: 42
attribute_dataset:
  name: qm9_attributed
  root: outputs/datasets
mixture_catflow:
  dataset:
    name: qm9_attributed
    root: outputs/datasets
  checkpoint_path: outputs/attribute_flows/qm9_catflow_stage2/checkpoint.pt
  device: auto
  hidden_dim: 128
  edge_dim: 64
  num_layers: 4
  num_mixtures: 1
  dropout: 0.0
  learning_rate: 0.0003
  weight_decay: 0.00001
  batch_size: 64
  epochs: 100
  sampling_steps: 64
  temperature: 1.0
