experiment: qm9_joint_mixture_catflow_baseline
seed: 42

# Baseline without explicit topology generation. This follows the CatFlow-style
# dense graph representation: node variables are atom types and edge variables
# are categorical states over {no-edge, bond types}.
attribute_dataset:
  name: qm9_attributed
  root: outputs/datasets

joint_mixture_catflow:
  dataset:
    name: qm9_attributed
    root: outputs/datasets
    max_train_graphs: null
    max_val_graphs: null
  checkpoint_path: outputs/attribute_flows/qm9_joint_mixture_catflow/checkpoint.pt
  device: cpu
  hidden_dim: 128
  edge_dim: 64
  num_layers: 4
  num_mixtures: 4
  dropout: 0.0
  noise_scale: 1.0
  learning_rate: 0.0003
  weight_decay: 0.00001
  batch_size: 64
  epochs: 100
  sampling_steps: 64
  temperature: 1.0
