comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: vanilla_gsdm_graphes_exposure_matched
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  native_reference:
    paper_model: GSDM
    released_profile: community_small.yaml
    native_epochs: 200
    native_batch_size: 128
  fairness_note: >-
    Vanilla spectral architecture/sampler follows released GSDM; training exposure
    follows the GraphES controlled comparison. No GraphES structural extension is enabled.

gdsm_simple:
  variant: vanilla_gsdm

  train:
    epochs: 10000
    batch_size: 128
    lr: 0.01
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_schedule: true
    # Chosen so decay across 10,000 exposure-matched epochs is approximately
    # the released Community-small schedule (.999 over 200 epochs).
    lr_decay: 0.9999799901935271
    ema: 0.999
    validation_every: 1
    log_every: 10

  model:
    max_nodes: 20
    # GraphES fixes the feature vocabulary from declared node support rather
    # than validation/test degree statistics.
    max_feat_num: 20
    hidden_dim: 32
    depth: 3

  sde:
    x:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    spectrum:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    eps: 1.0e-5
    eigen_mask: official_extremes

  sample:
    predictor: euler
    corrector: langevin
    snr: 0.05
    scale_eps: 0.7
    n_steps: 1
    noise_removal: true
    probability_flow: false
    eps: 1.0e-4
    threshold: 0.5
    use_ema: false

  generation_batch_size: 128

  runtime:
    device: auto

  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
