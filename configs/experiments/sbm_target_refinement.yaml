experiment: sbm_target_refinement
seed: 42

dataset:
  name: sbm
  config_path: configs/datasets/sbm.yaml
  root: outputs/datasets
  build_if_missing: true
  max_train_graphs: null
  max_reference_graphs: null

# The first implementation predicts local structure with connected induced
# graphlets of size 3 and 4 plus a clustering histogram.  Degree and density
# are hard invariants and therefore have zero refinement-energy weight.
summary:
  degree_hist_max_degree: auto
  clustering_bins: 20
  spectral_bins: 20
  clustering_summary: true
  spectral_summary: false
  motif_proxy: false
  orbit_count: false
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_connected_only: true
  graphlet_num_samples: 2048

degree_generator:
  enabled: true
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/sbm_target_refinement/checkpoint.pt
  device: auto
  deterministic: false
  epochs: 300
  batch_size: 32
  latent_dim: 32
  hidden_dim: 128
  size_condition_dim: 16
  # p_gamma(z | n): a size-conditioned mixture closes the aggregate-posterior
  # versus N(0,I) gap seen in prior-sampling MMD.
  prior_type: conditional_gmm
  prior_components: 4
  prior_hidden_dim: 128
  prior_logvar_min: -6.0
  prior_logvar_max: 4.0
  num_layers: 2
  dropout: 0.0
  learning_rate: 0.002
  weight_decay: 0.0
  beta: 0.01
  kl_warmup_epochs: 50
  node_weight: 1.0
  degree_weight: 5.0
  degree_moment_loss_weight: 1.0
  progress_interval: 30
  sample_num_nodes: empirical
  parity_conditioned: true
  max_parity_resample: 32
  max_resample: 200
  require_graphical: true
  require_connected_feasible: true
  fallback: empirical_nearest_n

# Evaluate DH-VAE before training the structural target generator.  Raw
# decoder rates reveal reliance on repair; accepted rates verify the hard
# guarantees after repair/resampling/fallback.
degree_evaluation:
  num_samples: 1024
  max_reference_sequences: 1024
  batch_size: 256
  output_dir: outputs/degree_generators/sbm_target_refinement/evaluation

# p_phi(s* | D, z): the central change in the target-conditioned proposal.
summary_generator:
  type: learned
  conditional_on_degree: true
  checkpoint_path: outputs/target_summary_generators/sbm_target_refinement/checkpoint.pt
  device: auto
  deterministic: false
  epochs: 300
  batch_size: 64
  latent_dim: 32
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0
  learning_rate: 0.002
  weight_decay: 0.0
  beta: 0.005
  kl_warmup_epochs: 50
  # Save the epoch with the best deterministic held-out objective rather than
  # blindly keeping the final epoch.
  validation_metric: loss
  loss_weights:
    num_nodes: 0.0
    degree: 0.0
    clustering: 1.0
    spectral: 0.0
    motif: 0.0
    orbit: 0.0
    # Graphlet history is decoded as one categorical distribution per k and
    # trained with per-size soft cross-entropy.
    graphlet: 2.0
    # Density is fixed by the degree condition. Only the non-invariant
    # triangle statistic is trained from the scalar head.
    scalar: 0.0
    density: 0.0
    triangle: 0.25
  progress_interval: 30

# Held-out gate after Step 4. MMD bandwidths are fixed from the real
# Train-to-Test comparison so every row is directly comparable.
target_summary_evaluation:
  max_train_graphs: 512
  max_test_graphs: 256
  samples_per_condition: 8
  batch_size: 256
  report_top_graphlet_bins: 10
  output_dir: outputs/target_summary_generators/sbm_target_refinement/evaluation

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

energy:
  degree_weight: 0.0
  density_weight: 0.0
  clustering_weight: 0.25
  spectral_weight: 0.0
  motif_weight: 0.0
  orbit_weight: 0.0
  triangle_weight: 0.0
  graphlet_weight: 1.0
  graphlet_size_weights:
    "3": 1.0
    "4": 1.0
  normalize_terms: true

# Begin with target_source=oracle.  Rebuild a second cache with
# --target-source predicted for deployment-aware fine-tuning.
teacher:
  type: energy_guided
  output_dir: outputs/teachers/sbm_target_refinement/oracle
  num_trajectories: 512
  val_fraction: 0.1
  steps: 40
  candidate_budget: 128
  preserve_connectivity: true
  selection: soft
  temperature: 0.05
  accept_only_improving: true
  min_improvement: 1.0e-6
  include_stop_action: true
  target_source: oracle
  predicted_target_probability: 0.0
  empirical_target_prob: 1.0
  progress_interval: 25

selector:
  type: graph_action_selector
  checkpoint_path: outputs/selectors/sbm_target_refinement/checkpoint.pt
  feature_version: 2
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1
  loss: soft_cross_entropy
  delta_regression_weight: 0.1
  learning_rate: 0.0003
  batch_size: 64
  epochs: 100
  weight_decay: 0.00001
  degree_width: 64
  clustering_width: 20
  spectral_width: 0
  motif_width: 0
  orbit_width: 0
  graphlet_width: 64
  device: auto

refiner:
  type: learned_selector
  steps: 80
  candidate_budget: 128
  preserve_connectivity: true
  selection: greedy
  use_stop_action: true
  exact_top_k: 8
  accept_only_improving: false
  min_improvement: 1.0e-6
  patience: 3
  target_energy_threshold: 0.001
  temperature: 0.1

oracle_refiner:
  type: grapher_opt
  steps: 80
  candidate_budget: 128
  preserve_connectivity: true
  selection: greedy
  accept_only_improving: true
  min_improvement: 1.0e-6

evaluation:
  num_generate: 40
  random_rewire_baseline: true
  oracle_grapher_opt_baseline: true
  learned_selector: true
  save_graphs: true
  compute_orbit: false
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_num_samples: 2048
