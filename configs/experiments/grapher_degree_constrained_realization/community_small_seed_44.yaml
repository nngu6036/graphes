experiment: community_small_grapher_degree_constrained_realization_seed_44
seed: 44
description: Laplacian log-gap spectral diffusion with degree, topology graphlet (3-5),
  and orbit summaries, decoded by stochastic exact-degree spectral realization; post-generation
  rewiring is disabled.
grapher:
  variant: vanilla_laplacian_loggap_graphlet
  train:
    epochs: 10000
    batch_size: 128
    lr: 0.01
    node_lr: 0.01
    spectrum_lr: 0.001
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_schedule: true
    lr_decay: 0.9999799901935271
    ema: 0.999
    validation_every: 1
    log_every: 10
  sde:
    x:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    spectrum:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    eps: 1.0e-05
    eigen_mask: laplacian_nonzero_prefix
    spectral_parameterization: laplacian_log_gap
    log_gap_epsilon: 1.0e-06
    log_gap_min_std: 0.001
    log_gap_exp_clip: 20.0
  sample:
    predictor: euler
    corrector: langevin
    snr: 0.05
    scale_eps: 0.7
    n_steps: 1
    noise_removal: true
    probability_flow: false
    eps: 0.0001
    threshold: 0.5
    use_ema: false
    eigenbasis_perturbation:
      enabled: false
    degree_constrained_realization:
      enabled: true
      method: gumbel_milp
      degree_source: laplacian_diagonal
      edge_count_source: spectral_trace
      edge_count_rounding: nearest
      require_connected: true
      score_transform: zscore
      score_clip: 8.0
      spectral_weight: 1.0
      gumbel_temperature: 0.15
      projection_degree_l1_weight: 1.0
      projection_spectral_tiebreak_weight: 0.0001
      projection_graphicality_check: true
      max_connectivity_cut_rounds: 16
      solver_time_limit_seconds: 5.0
      solver_mip_rel_gap: 0.0
      seed_offset: 810001
      failure_policy: error
      save_threshold_control: true
  structural_features:
    enabled: true
    binarize_threshold: 0.5
    random_walk:
      enabled: true
      steps: 4
    shortest_path:
      enabled: true
      max_distance: 5
  graphlet_summary:
    enabled: false
  graphlet_refinement:
    enabled: false
  structure_summary:
    enabled: true
    loss_weight: 0.1
    graphlet:
      enabled: true
      orders:
      - 3
      - 4
      - 5
      histogram_weight: 1.0
      mass_weight: 0.25
    clustering:
      enabled: false
      bins: 100
      histogram_weight: 0.25
      cdf_weight: 1.0
    orbit:
      enabled: true
      width: 15
      histogram_weight: 0.25
      log_total_weight: 0.1
    degree:
      enabled: true
      max_degree: 19
      histogram_weight: 0.25
      cdf_weight: 1.0
  generation_batch_size: 128
  runtime:
    device: auto
  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
  model:
    max_nodes: 20
    max_feat_num: 20
    hidden_dim: 32
    depth: 3
    backbone: dense_gcn
    node_backbone: dense_gcn
    spectrum_backbone: ppgn
    ppgn_hidden_dim: 64
    ppgn_depth: 4
    ppgn_residual_scale: 0.1
    ppgn_norm_eps: 1.0e-05
    ppgn_input_clip: 10.0
