comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: vanilla_laplacian_gsdm_stage2
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  reference_stage0:
    model: vanilla_gsdm
    spectral_operator: adjacency
  fairness_note: >-
    Stage-2 controlled ablation. The GSDM architecture, VP-SDE schedule,
    training exposure, training-only eigenbasis sampling, predictor-corrector
    sampler, and one-shot final threshold are retained. The only intended
    modeling change is replacing adjacency eigenvalues/eigenvectors with the
    combinatorial-Laplacian eigensystem. No DH-VAE, degree constraint,
    categorical edge head, rewiring, graphlet guidance, or post-hoc repair is used.

gdsm_simple:
  variant: vanilla_laplacian_gsdm

  train:
    epochs: 10000
    batch_size: 128
    lr: 0.01
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_schedule: true
    lr_decay: 0.9999799901935271
    ema: 0.999
    validation_every: 1
    log_every: 10

  model:
    max_nodes: 20
    max_feat_num: 20
    hidden_dim: 32
    depth: 3

  sde:
    x:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    spectrum:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    eps: 1.0e-5
    # Laplacian eigenvalues are stored in [:n]. The trivial zero mode at index 0
    # and all padding coordinates are fixed; only indices [1:n] are diffused.
    eigen_mask: laplacian_nonzero_prefix

  sample:
    predictor: euler
    corrector: langevin
    snr: 0.05
    scale_eps: 0.7
    n_steps: 1
    noise_removal: true
    probability_flow: false
    eps: 1.0e-4
    # For i != j, clean combinatorial Laplacian satisfies A_ij = -L_ij.
    threshold: 0.5
    use_ema: false

  generation_batch_size: 128

  runtime:
    device: auto

  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
