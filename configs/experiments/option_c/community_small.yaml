# Option C: categorical NODE diffusion + Gaussian weighted-ADJACENCY diffusion.
# Separate entry points: scripts/train_option_c.py and scripts/generate_option_c.py.
# All prepared training graphs; dataset definition/split/preprocessing are unchanged.
# Epochs/batch size follow the uploaded grapher_research/<dataset>_g345.yaml profile.
# This is a new, untuned architecture; comparable benchmark quality is not assumed.
# No edge-category softmax, independent spectral state, eigenbasis or DH-VAE.
# Edge values are divided by scale for diffusion; physical thresholds are restored at decoding.
# Spectral supervision: eigvalsh(predicted scaled W)/sqrt(n); CPU float64 remains differentiable.
# Graphlet orders 3,4,5, train-only vocabularies, exact connected induced counting.
# Refinement is FINAL ONLY and optional; raw pre-rewiring graphs are always saved.
option_c:
  schema_version: 1
  dataset:
    benchmark: community_small
    name: sbm
    root: outputs/datasets
    config_path: configs/datasets/community_small.yaml
  categories:
    node_attribute: null
    edge_attribute: null
    node_categories:
    - 0
    edge_categories:
    - 1
  edge_representation:
    weights:
      1: 1.0
    scale: 1.0
  node_noise:
    type: marginal
    schedule: cosine_exact_terminal
    pseudocount: 0.001
  diffusion:
    steps: 500
    prediction: clean_adjacency
  model:
    max_nodes: 20
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    ff_dim: 256
    dropout: 0.0
  spectral:
    normalization: sqrt_n
    solver_device: cpu
    dtype: float64
  graphlets:
    sizes:
    - 3
    - 4
    - 5
    size_weights:
    - 1.0
    - 1.0
    - 1.0
    connected_only: true
    counting: exact_connected
    clustering_bins: 100
    max_vocab_per_size: null
    min_train_count: 1
    max_connected_subsets: 1000000
  loss_weights:
    node: 1.0
    adjacency: 1.0
    spectral: 1.0
    graphlet: 0.5
    mass: 0.5
    clustering: 0.5
    orbit: 0.25
  training:
    epochs: 10000
    batch_size: 32
    lr: 0.0002
    weight_decay: 1.0e-06
    grad_norm: 1.0
    validation_every: 100
    validation_seed: 123456
    log_every: 100
    log_every_batches: 100
    checkpoint_every: 100
    permutation_augmentation: true
    ema_decay: 0.0
    cache_dir: outputs/cache/option_c
  sampling:
    steps: 500
    batch_size: 32
    sampler: ddpm
    clip_clean: true
    use_ema: false
    save_continuous: true
  refinement:
    enabled: true
    timing: final_only
    max_steps: 2
    proposal_budget: 128
    valid_candidate_budget: 64
    preserve_connectivity_if_connected: true
    require_structure_improvement: true
    min_improvement: 1.0e-08
    weights:
      graphlet: 1.0
      mass: 1.0
      clustering: 0.5
      orbit: 0.25
      spectral: 0.25
      adjacency: 0.1
  protocol:
    seeds:
    - 42
    - 43
    - 44
    generated_graphs_per_seed: 1024
    full_training_split: true
