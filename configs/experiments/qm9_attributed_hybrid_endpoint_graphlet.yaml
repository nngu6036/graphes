experiment: qm9_attributed_hybrid_endpoint_graphlet
seed: 42

dataset:
  name: qm9_attributed
  config_path: configs/datasets/qm9_attributed.yaml
  root: outputs/datasets
  build_if_missing: false
  # Start with these limits to keep the in-memory teacher set manageable.
  # Set them to null, or override them on the command line, for the full split.
  max_train_graphs: 10000
  max_val_graphs: 1000

# Heavy-atom QM9 categories. Edge index zero remains reserved for no edge.
categorical_state:
  node_attribute: atomic_num
  node_categories: [6, 7, 8, 9]
  edge_attribute: bond_type
  edge_categories: [1, 2, 3, 4]

graphlet_prediction:
  graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_connected_only: true
  # Sampled extraction avoids launching ORCA while building every training
  # target. Final evaluation below uses exact ORCA.
  graphlet_backend: sampled
  graphlet_num_samples: null
  clustering_summary: false
  spectral_summary: false
  motif_proxy: false
  orbit_count: false

endpoint_trajectory:
  steps: 10
  candidate_budget: 64
  states_per_graph: 4
  preserve_connectivity: true
  ensure_connected_source: true
  max_repair_trials: 10000
  shared_relabel_augmentation: true

endpoint_predictor:
  checkpoint_path: outputs/hybrid_endpoint/qm9_attributed/checkpoint.pt
  device: auto
  hidden_dim: 128
  edge_dim: 64
  graph_dim: 128
  num_layers: 4
  dropout: 0.0
  min_concentration: 0.05
  max_concentration: 50.0
  batch_size: 64
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 0.00001
  no_edge_class_weight: 0.10
  present_edge_class_weight: 1.0
  target_epsilon: 0.00001
  loss_weights:
    node: 1.0
    edge: 1.0
    graphlet_mean: 1.0
    graphlet_distribution: 0.1
    graphlet_mass: 0.25
  progress_interval: 5

# Use oracle test degrees for the first refiner-only evaluation. Change this
# to learned after training a degree generator for QM9.
generation:
  degree_source: oracle
  num_generate: 1024

degree_generator:
  enabled: false
  type: degree_histogram_vae
  checkpoint_path: outputs/degree_generators/qm9_attributed/checkpoint.pt
  device: auto

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: false
  max_repair_trials: 10000

# Initialize every topology-only HH source with complete molecular attributes.
# Atom types are sampled from the training-set distribution conditional on
# node degree. Bond types are sampled subject to the remaining valence at both
# endpoints. Aromatic type 4 is deliberately excluded because the prepared
# QM9 graphs are kekulized into single/double bonds.
molecular_generation:
  enabled: true
  allowed_atom_types: [6, 7, 8, 9]
  allowed_bond_types: [1, 2, 3]
  sample_attributes: true
  smoothing: 0.05
  max_initialization_attempts: 16
  require_rdkit_source_validity: true

hybrid_refiner:
  steps: 10
  candidate_budget: 256
  preserve_connectivity: true
  selection: greedy
  temperature: 0.1
  categorical_weight: 1.0
  probability_weight: 0.0
  graphlet_weight: 1.0
  graphlet_mass_weight: 0.25
  graphlet_top_k: 8
  accept_only_improving: true
  min_improvement: 0.00000001
  patience: 2
  sample_endpoint: true
  sample_graphlet: true
  endpoint_temperature: 1.0
  refresh_prediction_every: 1
  infeasible_target_policy: guidance_only
  report_guidance_consistency: false
  # Swap only edge pairs with the same bond type and transfer that type to
  # both new edges. Each node therefore loses and gains the same bond order,
  # preserving weighted valence exactly.
  require_same_edge_type_pair: true
  preserve_removed_edge_type: true
  enforce_molecular_valence: true
  molecular_allowed_bond_types: [1, 2, 3]
  molecular_candidate_attempt_multiplier: 2
  # Apply RDKit sanitization to the graphlet-shortlisted candidates. This is
  # stricter than valence checking alone and guarantees that accepted swaps
  # remain chemically valid under the evaluator's exact protocol.
  rdkit_candidate_check: true

evaluation:
  # Leave null to use ORCA_EXEC or an `orca` executable on PATH.
  orca_exec: null
  compute_orbit: true
  compute_graphlet_history: true
  graphlet_k_min: 3
  graphlet_k_max: 4
  graphlet_connected_only: true
  graphlet_backend: exact_orca
  graphlet_num_samples: null
