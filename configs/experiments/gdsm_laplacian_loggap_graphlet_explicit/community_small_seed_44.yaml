comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: vanilla_laplacian_loggap_graphlet_joint_stage2b_seed_44
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  comparison_targets:
    adjacency_stage0: vanilla_gsdm
    laplacian_stage2a: vanilla_laplacian_gsdm
  fairness_note: >-
    Controlled Stage-2b ablation. The graph representation is the combinatorial
    Laplacian, but the diffused spectral state is the standardized logarithm of
    successive nontrivial Laplacian eigenvalue gaps. This guarantees a zero
    first eigenvalue and nonnegative nondecreasing reconstructed eigenvalues.
    A graphlet-summary head is trained jointly as an auxiliary task from the
    same noisy spectral states, predicting clean connected induced graphlet
    histograms for orders 3,4,5 and connected-subset mass. There is no degree
    prior, hard degree constraint, rewiring, categorical edge head, or post-hoc
    graph repair in this ablation.

gdsm_simple:
  variant: vanilla_laplacian_loggap_graphlet

  train:
    epochs: 10000
    batch_size: 128
    lr: 0.01
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_schedule: true
    lr_decay: 0.9999799901935271
    ema: 0.999
    validation_every: 1
    log_every: 10

  model:
    max_nodes: 20
    max_feat_num: 20
    hidden_dim: 32
    depth: 3

  sde:
    x:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    spectrum:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    eps: 1.0e-5
    eigen_mask: laplacian_nonzero_prefix
    spectral_parameterization: laplacian_log_gap
    log_gap_epsilon: 1.0e-6
    log_gap_min_std: 1.0e-3
    log_gap_exp_clip: 20.0

  graphlet_summary:
    enabled: true
    orders: [3, 4, 5]
    loss_weight: 0.10
    histogram_weight: 1.0
    mass_weight: 0.25

  sample:
    predictor: euler
    corrector: langevin
    snr: 0.05
    scale_eps: 0.7
    n_steps: 1
    noise_removal: true
    probability_flow: false
    eps: 1.0e-4
    threshold: 0.5
    use_ema: false

  generation_batch_size: 128

  runtime:
    device: auto

  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
