comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: vanilla_gsdm_plus_joint_dhvae_unconstrained
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  native_reference:
    paper_model: GSDM
    released_profile: community_small.yaml
    native_epochs: 200
    native_batch_size: 128
  fairness_note: 'Stage-1 controlled ablation: vanilla GSDM graph generation is unchanged.
    An auxiliary DH-VAE is co-trained on the same training split and samples one degree
    sequence per returned graph, but those sequences are not provided to the spectral
    model, eigenbasis sampler, adjacency threshold, or any constraint.'
gdsm_simple:
  variant: vanilla_gsdm_dhvae
  train:
    epochs: 10000
    batch_size: 128
    lr: 0.01
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_schedule: true
    lr_decay: 0.9999799901935271
    ema: 0.999
    validation_every: 1
    log_every: 10
  model:
    max_nodes: 20
    max_feat_num: 20
    hidden_dim: 32
    depth: 3
  sde:
    x:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    spectrum:
      type: vp
      beta_min: 0.1
      beta_max: 1.0
      num_scales: 1000
    eps: 1.0e-05
    eigen_mask: official_extremes
  sample:
    predictor: euler
    corrector: langevin
    snr: 0.05
    scale_eps: 0.7
    n_steps: 1
    noise_removal: true
    probability_flow: false
    eps: 0.0001
    threshold: 0.5
    use_ema: false
  generation_batch_size: 128
  runtime:
    device: auto
  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
  degree_prior:
    enabled: true
    batch_size: 64
    latent_dim: 32
    hidden_dim: 128
    size_condition_dim: 16
    edge_condition_dim: 16
    use_edge_count_conditioning: true
    prior_condition_on_edges: true
    prior_type: conditional_gmm
    prior_components: 4
    prior_hidden_dim: 128
    prior_logvar_min: -6.0
    prior_logvar_max: 4.0
    num_layers: 2
    dropout: 0.0
    learning_rate: 0.001
    weight_decay: 1.0e-05
    kl_loss_weight: 0.005
    kl_warmup_epochs: 50
    node_count_loss_weight: 1.0
    edge_count_loss_weight: 2.0
    degree_histogram_loss_weight: 5.0
    degree_moment_loss_weight: 0.25
    prior_distribution_loss_weight: 1.0
    prior_distribution_kernel_sigma: 0.2
    aggregate_prior_moment_loss_weight: 0.05
    require_connected: true
    sample_num_nodes: empirical
    sample_num_edges: model
    exact_degree_sum_conditioning: true
    max_resample: 500
    model_resample_attempts: 32
    parity_conditioned: false
    max_parity_resample: 1
    postprocess_policy: reject_only
    fallback: error
