experiment: coarse_to_fine_sbm_v0_stage7_learned
seed: 42

dataset:
  name: sbm
  config_path: configs/datasets/sbm.yaml
  root: outputs/datasets
  build_if_missing: true
  max_train_graphs: 64
  max_reference_graphs: 20

summary:
  degree_hist_max_degree: auto
  clustering_bins: 20
  spectral_bins: 20
  motif_proxy: true
  orbit_count: false

summary_generator:
  type: learned
  checkpoint_path: outputs/summary_generators/sbm_v0/checkpoint.pt
  device: auto
  deterministic: false
  epochs: 200
  batch_size: 32
  latent_dim: 32
  hidden_dim: 128
  num_layers: 2
  dropout: 0.0
  learning_rate: 0.002
  weight_decay: 0.0
  beta: 0.001
  loss_weights: {}
  progress_interval: 20

constructor:
  type: havel_hakimi
  ensure_connected: true
  random_relabel: true
  max_repair_trials: 10000

energy:
  degree_weight: 0.0
  clustering_weight: 1.0
  spectral_weight: 0.0
  motif_weight: 0.5
  orbit_weight: 0.0
  density_weight: 0.0
  triangle_weight: 0.2
  normalize_terms: true

refiner:
  type: grapher_opt
  steps: 20
  candidate_budget: 64
  preserve_connectivity: true
  selection: greedy
  accept_only_improving: true
  min_improvement: 1.0e-12

evaluation:
  num_generate: 20
  random_rewire_baseline: true
  save_graphs: true
  compute_orbit: true
