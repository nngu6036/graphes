# Common report-facing Community-small benchmark.
# Pin the serialized SPECTRE artifact instead of regenerating an approximate SBM.
name: sbm
# Historical serialized alias retained for compatibility with existing GraphES code.
type: sbm
benchmark: community_small
protocol_id: graphes_community_small_spectre_v2

seed: 0
num_graphs: 100

source:
  kind: spectre_pt
  provider: SPECTRE
  artifact: community_12_21_100.pt
  url: https://raw.githubusercontent.com/KarolisMart/SPECTRE/main/data/community_12_21_100.pt
  path: outputs/datasets/sources/spectre/community_12_21_100.pt
  expected_graphs: 100

# Use the intended SPECTRE-style 80/20 train/test partition and reserve 20% of
# the training side for validation: 64/16/20.  The split is disjoint.
split:
  seed: 0
  train: 0.64
  val: 0.16
  test: 0.20

filters:
  require_connected: true
  reject_zero_degree: true

# Native-code notes are documentation only; GraphES always uses the common
# split above for reruns.
native_reference:
  graphrnn:
    dataset_identity: different_native_generator
    note: original GraphRNN community code generates 3000 graphs rather than this SPECTRE artifact
  digress:
    dataset_name: comm20
    artifact: community_12_21_100.pt
    intended_split: [0.64, 0.16, 0.20]
    attached_code_note: declares num_graphs=200 for the 100-graph artifact and duplicates processed records
  defog:
    dataset_name: comm20
    artifact: community_12_21_100.pt
    intended_split: [0.64, 0.16, 0.20]
    attached_code_note: declares num_graphs=200 for the 100-graph artifact
  hog_diff:
    dataset_name: community_small
    test_fraction: 0.20
