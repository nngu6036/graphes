# Full ZINC250k benchmark aligned to the molecular protocol used by HOG-Diff
# and inherited from GDSS/Jo et al.  The raw row order is part of the protocol
# because valid_idx_zinc250k.json identifies the held-out test molecules by
# zero-based source-row index.
name: zinc
kind: prepared_molecular_attributed
root: outputs/datasets
protocol_id: hogdiff_gdss_zinc250k_v1

source:
  dataset: ZINC250k
  provider: GDSS/HOG-Diff
  expected_records: 249455
  expected_graphs: 249455
  # HOG-Diff README points to the original Chemical-VAE ZINC250k CSV.
  smiles_url: https://raw.githubusercontent.com/aspuru-guzik-group/chemical_vae/main/models/zinc_properties/250k_rndm_zinc_drugs_clean_3.csv
  gdss_smiles_mirror: https://raw.githubusercontent.com/harryjo97/GDSS/master/data/zinc250k.csv
  test_indices_url: https://raw.githubusercontent.com/harryjo97/GDSS/master/data/valid_idx_zinc250k.json
  selection: source_order_full
  test_indices:
    scheme: gdss_valid_idx_zinc250k
    index_base: 0
    required: true
    path: data/zinc/valid_idx_zinc250k.json

split:
  # HOG-Diff uses the GDSS held-out index list as its molecular test set and
  # trains on the complete complement.  GraphER preserves that exact test set
  # and reserves only 1000 molecules from the HOG-Diff training complement for
  # checkpoint selection.  No test molecule is used for tuning.
  strategy: hogdiff_gdss_fixed_test_indices
  seed: 42
  validation_count: 1000
  train: complement_of_test_indices_minus_validation
  val: deterministic_subset_of_training_complement
  test: test_indices

preprocessing:
  representation: heavy_atom_kekulized_graph
  hydrogens: implicit
  remove_hydrogens: true
  remove_self_loops: true
  undirected: true
  # HOG-Diff processes each source SMILES as one molecule and does not apply a
  # largest-fragment rewrite.  Preserve source connectivity exactly.
  fragment_policy: preserve
  sanitize_with_rdkit: true
  kekulize: true
  retain_aromatic_bonds: false
  # HOG-Diff's graph state contains atom identity only, not formal charge or
  # stereochemistry.  Charges/stereo may remain in source SMILES metadata but
  # are deliberately projected out of the categorical graph state.
  retain_formal_charge: false
  retain_stereochemistry: false
  max_nodes: 38

filters:
  # These are protocol assertions rather than a subset-selection policy.  The
  # canonical HOG-Diff/GDSS source is expected to satisfy them for all 249455
  # rows; preparation fails if a row cannot be represented.
  require_connected: false
  neutral_only: false
  uncharged_atoms_only: false
  allowed_atomic_numbers: [6, 7, 8, 9, 15, 16, 17, 35, 53]

categorical_state:
  node_attribute: atomic_num
  node_categories: [6, 7, 8, 9, 15, 16, 17, 35, 53]
  edge_attribute: bond_type
  # HOG-Diff kekulizes aromatic systems and uses only single/double/triple
  # bond categories (plus no-edge internally).
  edge_categories: [1, 2, 3]

bond_orders:
  1: 1.0
  2: 2.0
  3: 3.0

evaluation:
  generated_samples: 10000
  molecular_protocol: hogdiff
  use_valency_correction_for_distribution_metrics: true

native_reference:
  hog_diff:
    dataset_name: zinc250k
    total_graphs: 249455
    max_nodes: 38
    atom_channels: 9
    atom_numbers: [6, 7, 8, 9, 15, 16, 17, 35, 53]
    bond_categories: [1, 2, 3]
    kekulized_bonds: true
    split: gdss_valid_idx_zinc250k
    evaluation_samples: 10000
  gdss:
    dataset_name: zinc250k
    split: valid_idx_zinc250k
  defog:
    dataset_name: zinc
    remove_hydrogens: true
    aromatic: false
    max_nodes: 38
  digress:
    dataset_name: zinc
    native_configuration: not shipped by upstream DiGress
    architecture_template:
      dataset: qm9
      experiment: qm9_no_h
      scope: Hydra composition and molecular dataset-loader architecture only
    atom_channels: 9
    atom_numbers: [6, 7, 8, 9, 15, 16, 17, 35, 53]
    bond_categories: [1, 2, 3]
    empirical_categorical_priors: computed from the exact converted GraphER ZINC training split
    node_count_prior: computed from converted GraphER ZINC training and validation splits
    external_checkout_modified: false
  graphrnn:
    availability: no native molecular ZINC configuration
