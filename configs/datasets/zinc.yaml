# Fixed 12k subset derived from ZINC250k. This remains a GraphES-specific
# controlled subset, so native/published full-ZINC250k numbers are not directly
# protocol-compatible. All rerun methods must consume this same prepared split.
name: zinc
kind: prepared_molecular_attributed
root: outputs/datasets
protocol_id: graphes_zinc250k_fixed12k_v2

source:
  dataset: ZINC250k
  subset:
    name: grapher_fixed_12k
    selection: first_valid_after_seeded_shuffle
    seed: 0
    expected_graphs: 12000

split:
  train: 10000
  val: 1000
  test: 1000

preprocessing:
  representation: heavy_atom_graph
  hydrogens: implicit
  remove_hydrogens: true
  remove_self_loops: true
  undirected: true
  keep_largest_fragment: true
  sanitize_with_rdkit: true
  # Align the categorical bond representation with attached HOG-Diff and
  # DeFoG ZINC code: aromatic systems are kekulized to single/double bonds.
  kekulize: true
  retain_aromatic_bonds: false
  retain_formal_charge: false
  retain_stereochemistry: false
  max_nodes: 38

filters:
  require_connected: true
  neutral_only: true
  # DeFoG's categorical ZINC state has no formal-charge channel. Reject even
  # net-neutral zwitterions so the prepared source has a lossless model view.
  uncharged_atoms_only: true
  allowed_atomic_numbers: [6, 7, 8, 9, 15, 16, 17, 35, 53]

categorical_state:
  node_attribute: atomic_num
  node_categories: [6, 7, 8, 9, 15, 16, 17, 35, 53]
  edge_attribute: bond_type
  edge_categories: [1, 2, 3]

bond_orders:
  1: 1.0
  2: 2.0
  3: 3.0

native_reference:
  defog:
    dataset_name: zinc
    remove_hydrogens: true
    aromatic: false
    max_nodes: 38
    native_dataset_scope: full_ZINC250k
  hog_diff:
    dataset_name: zinc250k
    atom_channels: 9
    max_nodes: 38
    kekulized_bonds: true
    evaluation_samples: 10000
    native_dataset_scope: full_ZINC250k
  digress:
    availability: no shipped ZINC dataset configuration in the attached repository
  graphrnn:
    availability: no native molecular ZINC configuration
