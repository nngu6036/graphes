name: ego_citeseer
seed: 42
root: outputs/datasets
pyg_root: outputs/raw_datasets/citeseer

# GraphRNN-style Ego-small / Ego-Citeseer benchmark defaults.
# The builder first tries a local GraphRNN/Planetoid pickle named
# ind.citeseer.graph, then falls back to torch_geometric.datasets.Planetoid.
source: auto
raw_graph_path: null
num_graphs: 200
radius: 3
min_nodes: 4
max_nodes: 18
largest_connected_component: true
allow_fewer: true
# If true, fail when num_graphs exceeds the number of eligible ego-graph candidates.
# The default false uses min(num_graphs, available_candidates), which is safer
# for diagnostics and for configs copied from large synthetic datasets.
strict_num_graphs: false
shuffle: true
remove_self_loops: true

# Keep the generic benchmark topology-only by default. These can be enabled for
# diagnostics, but Graph-ER training/generation currently uses the topology path.
include_node_labels: false
include_node_features: false

preprocessing:
  make_undirected: true
  relabel_nodes: true
  graph_size_filter:
    min_nodes: 4
    max_nodes: 18

split:
  train: 0.8
  val: 0.1
  test: 0.1

graph_attributes:
  enabled: auto
  add_default_node_features: true
  add_default_node_labels: true
  add_default_edge_labels: true
  default_node_feature_dim: 1
