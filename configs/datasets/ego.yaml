name: ego
type: ego
seed: 0
num_graphs: 757
split:
  train: 0.8
  val: 0.1
  test: 0.1
ego:
  source_model: citeseer
  source_root: outputs/datasets/pyg
  radius: 3
  min_nodes: 50
  max_nodes: 399
  sample_with_replacement: false
filters:
  require_connected: true
  reject_zero_degree: true
  max_attempts_per_graph: 300
