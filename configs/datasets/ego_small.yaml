# Ego-small benchmark used by GDSS and subsequent graph-generation work.
name: ego_small
type: ego
benchmark: ego_small

# Keep dataset preparation fixed across model-training seeds.
seed: 0
num_graphs: 200

# The original benchmark uses an 80/20 train/test split. We reserve 20 graphs
# from the training side for validation while retaining 40 held-out test graphs.
split:
  train: 0.7
  val: 0.1
  test: 0.2

ego:
  source_model: citeseer
  source_root: outputs/datasets/planetoid
  source_graph_url: https://github.com/kimiyoung/planetoid/raw/master/data/ind.citeseer.graph
  largest_connected_component: true
  radius: 1
  min_nodes: 4
  max_nodes: 18
  # The official generator iterates over the relabelled Citeseer component and
  # retains the first 200 qualifying ego graphs.
  selection: first
  sample_with_replacement: false

filters:
  require_connected: true
  reject_zero_degree: true
  max_attempts_per_graph: 300
