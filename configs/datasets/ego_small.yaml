# Common report-facing Ego-small benchmark.
# Pin the serialized EDGE ego-graph artifact used by DeFoG instead of rebuilding
# ego neighborhoods from Citeseer with potentially different filtering/order.
name: ego_small
type: ego
benchmark: ego_small
protocol_id: graphes_ego_small_edge_v2

seed: 1234
num_graphs: 200

source:
  kind: networkx_pickle
  provider: EDGE
  artifact: Ego.pkl
  url: https://raw.githubusercontent.com/tufts-ml/graph-generation-EDGE/main/graphs/Ego.pkl
  path: outputs/datasets/sources/edge/Ego.pkl
  expected_graphs: 200

# Common disjoint split. This preserves a 20% test set while avoiding the
# train/validation overlap present in some legacy loaders.
split:
  seed: 1234
  train: 0.64
  val: 0.16
  test: 0.20

filters:
  require_connected: true
  reject_zero_degree: true

native_reference:
  graphrnn:
    dataset_name: citeseer_small
    construction: radius_1_citeseer_ego
    min_nodes: 4
    max_nodes: 20
    note: native GraphRNN shuffles 200 ego graphs and uses an overlapping validation subset
  defog:
    dataset_name: ego
    artifact: Ego.pkl
    test_fraction: 0.20
    note: attached loader uses validation as a subset of training; GraphES intentionally uses disjoint validation
  hog_diff:
    dataset_name: ego_small
    max_nodes: 18
    test_fraction: 0.20
  digress:
    availability: no shipped Ego-small dataset config in the attached repository
