# Common report-facing Ego-small benchmark.
#
# IMPORTANT: Ego-small is NOT the 757-graph EDGE `Ego.pkl` benchmark.  The
# latter is the separate, larger `Ego` dataset.  Ego-small follows the GDSS /
# small-graph Citeseer construction: radius-1 ego networks from the largest
# connected Citeseer component, retaining 4--18 nodes and the first 200
# qualifying centers.
name: ego_small
type: ego
benchmark: ego_small
protocol_id: graphes_ego_small_gdss_v3

seed: 1234
num_graphs: 200

# Match the GDSS Ego-small graph identity.  The Planetoid Citeseer adjacency
# pickle is fetched on first preparation when it is not already cached.
ego:
  source_model: citeseer
  source_root: outputs/datasets/planetoid
  source_graph_url: https://github.com/kimiyoung/planetoid/raw/master/data/ind.citeseer.graph
  largest_connected_component: true
  radius: 1
  min_nodes: 4
  max_nodes: 18
  selection: first
  sample_with_replacement: false

# Common GraphES disjoint split.  This is deliberately shared by all rerun
# baselines; it is not the overlapping validation convention used by some
# legacy repositories.
split:
  seed: 1234
  train: 0.64
  val: 0.16
  test: 0.20

filters:
  require_connected: true
  reject_zero_degree: true

native_reference:
  gdss:
    construction: radius_1_citeseer_ego
    min_nodes: 4
    max_nodes: 18
    selection: first_200
    note: This is the source identity adopted by the common GraphES rerun protocol.
  graphrnn:
    dataset_name: citeseer_small
    construction: radius_1_citeseer_ego
    min_nodes: 4
    max_nodes: 20
    selection: shuffled_200
    note: Native GraphRNN differs slightly (max 20 and random shuffle); the wrapper uses the common prepared GraphES split instead.
  defog:
    native_ego_artifact: Ego.pkl
    native_ego_graphs: 757
    note: The attached DeFoG `ego` loader is the separate Ego benchmark, not Ego-small. GraphES therefore uses DeFoG's generic compatibility architecture on the common Ego-small split.
  hog_diff:
    dataset_name: ego_small
    max_nodes: 18
    test_fraction: 0.20
    note: The attached archive does not include its preprocessed pickle, so exact graph ordering cannot be proven from the archive alone.
  digress:
    availability: no shipped Ego-small dataset config in the attached repository
