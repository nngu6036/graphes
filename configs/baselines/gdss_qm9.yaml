comparison:
  model: gdss
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_guarded_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 200
    epochs: 200
    cap_applied: false
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is min(common target, 
    declared native/reference budget); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/qm9.yaml
    epochs: 300
    batch_size: 1024
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: qm9.yaml
  sampling_config: sample_qm9.yaml
  native_dataset: QM9
  num_workers: 0
  generation_batch_size: 256
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds:
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 50
      generation_batch_interval: 1
  batch_size: 1024
  train:
    num_epochs: 200
    lr: 0.005
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.9985003750625234
    eps: 1.0e-05
