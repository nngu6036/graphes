comparison:
  model: digress
  dataset: grid
  common_config: null
  status: adapted_from_upstream_planar_profile
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/planar.yaml
    epochs: 100000
    batch_size: 64
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
digress:
  native_dataset: planar
  experiment: planar
  n_epochs: 100000
  batch_size: 64
  num_workers: 0
  check_val_every_n_epochs: 100
  save_every_n_epochs: 5000
  generation_batch_size: 16
  training_estimates:
    enabled: true
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 1000
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
