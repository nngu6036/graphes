comparison:
  model: digress
  dataset: grid
  common_config: null
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/planar.yaml
    epochs: 100000
    batch_size: 64
digress:
  native_dataset: planar
  experiment: planar
  n_epochs: 10000
  batch_size: 64
  num_workers: 0
  check_val_every_n_epochs: 200
  save_every_n_epochs: 1000
  generation_batch_size: 16
  training_estimates:
    enabled: true
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 200
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
