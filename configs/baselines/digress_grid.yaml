digress:
  # Grid uses the attached planar model architecture and generic loader, but is
  # trained only on GraphES's frozen Grid splits.
  native_dataset: planar
  experiment: planar
  n_epochs: 100000
  batch_size: 32
  num_workers: 0
  check_val_every_n_epochs: 100
  save_every_n_epochs: 5000
  generation_batch_size: 16

  training_estimates:
    enabled: true

  runtime:
    gpus: 1
    cuda_visible_devices: "0"
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 1000
      generation_batch_interval: 1
