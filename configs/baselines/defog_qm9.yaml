# Sampling and architecture retain the upstream experiment defaults.
comparison:
  model: defog
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_guarded_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 200
    epochs: 200
    cap_applied: false
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is min(common target, 
    declared native/reference budget); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/qm9_no_h.yaml
    epochs: 1000
    batch_size: 1024
defog:
  source_env: DEFOG
  python_env: DEFOG_PYTHON
  native_dataset: qm9
  experiment: qm9_no_h
  n_epochs: 200
  batch_size: 1024
  num_workers: 0
  check_val_every_n_epochs: 5
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 1.0e-12
  ema_decay: 0.0
  pin_memory: true
  remove_hydrogens: true
  aromatic: true
