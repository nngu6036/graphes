# Sampling and architecture retain the upstream experiment defaults.
comparison:
  model: defog
  dataset: qm9
  common_config: common_qm9.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 200
    epochs: 200
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
defog:
  source_env: DEFOG
  python_env: DEFOG_PYTHON
  native_dataset: qm9
  experiment: qm9_no_h
  n_epochs: 200
  batch_size: 1024
  num_workers: 0
  check_val_every_n_epochs: 5
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 1.0e-12
  ema_decay: 0.0
  pin_memory: true
  remove_hydrogens: true
  aromatic: true
