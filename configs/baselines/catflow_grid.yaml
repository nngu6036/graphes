comparison:
  model: catflow
  dataset: grid
  common_config: null
  status: native_budget_capped_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 10000
    target_train_passes: 1000
    epochs: 1000
    cap_applied: true
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is capped at the smaller upstream CatFlow CLI-default budget (the release has no generic-graph profile); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_cli_default_fallback
    unit: epochs
    source: main.py --epochs default; no released generic-graph profile
    epochs: 1000
    batch_size: 128
catflow:
  train:
    epochs: 1000
    batch_size: 2
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 200
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 2
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
