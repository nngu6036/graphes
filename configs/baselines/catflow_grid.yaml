comparison:
  model: catflow
  dataset: grid
  common_config: null
  status: generic_adapter_no_upstream_grid_profile
  budget:
    basis: adapter_budget_requires_validation_check
    unit: epochs
    source: GraphER adapter; uploaded CatFlow README has no Grid profile
    epochs: 1000
    batch_size: 2
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
catflow:
  train:
    epochs: 1000
    batch_size: 2
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 100
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 2
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
