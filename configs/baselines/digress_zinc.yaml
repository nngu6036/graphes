comparison:
  model: digress
  dataset: zinc
  common_config: common_zinc.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 200
    epochs: 200
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: closest_profile_or_adapter
    unit: epochs
    source: GraphER adapter; uploaded DiGress has no ZINC experiment
    epochs: 1000
    batch_size: 256
digress:
  native_dataset: zinc
  experiment: zinc_no_h
  n_epochs: 200
  batch_size: 256
  num_workers: 0
  check_val_every_n_epochs: 5
  save_every_n_epochs: 20
  generation_batch_size: 128
  training_estimates:
    enabled: true
    num_graphs: 1024
    batch_size: 128
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 10
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
