comparison:
  model: spectre
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_capped_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 30
    epochs: 30
    cap_applied: true
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is capped at the smaller 
    upstream native budget; checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: README QM9 command
    epochs: 30
    batch_size: 128
spectre:
  train:
    epochs: 30
    batch_size: 128
    log_every: 1
    singleton_policy: empirical
  model:
    k_eigval: 2
    gen_gelu: true
    disc_gelu: true
    SON_D_full_readout: true
    SON_normalize_left: true
    SON_small: true
    lambda_gating: true
    lambda_last_gating: true
    lambda_upsample: true
    noisy_gen: true
    noisy_disc: true
    derived_eigval_noise: true
    normalize_noise: true
    spectral_norm: true
    eigvec_right_noise: true
    gp_shared_alpha: true
    no_restart: true
    gp_do_backwards: true
    eigvec_sign_flip: true
    ignore_first_eigv: true
    gp_include_unpermuted: true
    clip_grad_norm: 1.0
    eigvec_temp_decay: true
    eigval_temp_decay: true
    decay_eigvec_temp_over: 10
    decay_eigval_temp_over: 10
    n_eigval_warmup_epochs: 10
    n_eigvec_warmup_epochs: 15
    min_eigval_temp: 0.8
    min_eigvec_temp: 0.8
    SON_gumbel_temperature_decay: true
    decay_SON_gumbel_temp_over: 25
    SON_gumbel_temperature_warmup_epochs: 0
    n_G: 3
    n_D: 3
    lr_g: 0.0001
    lr_d: 0.0001
    beta1: 0.5
    beta2: 0.9
    weight_decay: 0.0
    ema: 0.995
  sample:
    use_ema: true
  generation_batch_size: 32
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: SPECTRE
  python_env: SPECTRE_PYTHON
  training_estimates:
    enabled: false
