baseline_common:
  schema_version: 1
  dataset: zinc
  reference:
    model: defog
    native_dataset: zinc
    experiment: zinc
    status: exact_upstream_profile_on_graphes_common_split
    source_files:
    - configs/experiment/zinc.yaml
    - configs/train/train_default.yaml
    - configs/dataset/zinc.yaml
  training:
    epochs: 300
    batch_size: 256
    optimizer: adamw
    learning_rate: 0.0002
    weight_decay: 1.0e-12
    gradient_clip_norm: null
    ema_decay: 0.0
    num_workers: 4
    validation_every_epochs: 4
  data:
    remove_hydrogens: true
    pin_memory: false
    aromatic: false
  reference_only:
    sample_every_validation: 2
    validation_samples: 256
    final_model_samples: 10000
    sample_steps: 1000
    sample_time_distortion: polydec
    sample_omega: 0.1
    sample_eta: 300
    train_time_distortion: polydec
    model_layers: 12
    transition: marginal
    rrwp_steps: 20
  policy:
    role: defog_reference_fallback_not_universal_training_horizon
    raw_epoch_counts_cross_model_comparable: false
    training_budget_rule: released_model_dataset_profile_or_validation_selected_adaptation
    merge_precedence:
    - upstream_defaults
    - common_reference_fallback
    - model_specific_config
    - explicit_cli
    budget_selection_uses_test_split: false
  protocol:
    fixed_prepared_splits: true
    model_selection_split: val
    final_evaluation_split: test
    evaluation_seeds:
    - 42
    - 43
    - 44
    same_evaluator_across_models: true
    same_requested_sample_count_per_report: true
