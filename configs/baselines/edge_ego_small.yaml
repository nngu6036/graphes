comparison:
  model: edge
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_generic_budget
    unit: epochs
    source: uploaded EDGE README training command
    epochs: 50000
    batch_size: 8
    diffusion_steps: 64
edge:
  train:
    epochs: 10000
    batch_size: 8
    lr: 0.0001
    clip_value: 1.0
    log_every: 100
  model:
    arch: TGNN_degree_guided
    parametrization: xt_prescribed_st
    loss_type: vb_ce_xt_prescribred_st
    diffusion_steps: 64
    diffusion_dim: 64
    noise_schedule: linear
    dp_rate: 0.1
    num_heads:
    - 8
    - 8
    - 8
    - 8
    - 1
  generation_batch_size: 32
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: EDGE
  python_env: EDGE_PYTHON
  training_estimates:
    enabled: false
