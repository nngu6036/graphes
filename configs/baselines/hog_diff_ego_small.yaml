# Stage iteration counts are resolved from the actual train split at launch.
comparison:
  model: hog_diff
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    stage_exposure_weights:
      higher_order: 448000
      ou: 256000
    resolution: wrapper_from_actual_prepared_train_split
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_two_stage_budget
    unit: stage_iterations
    source: configs/ego.yaml
    higher_order_iterations: 14000
    higher_order_batch_size: 32
    ou_iterations: 4000
    ou_batch_size: 64
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: ego.yaml
  native_dataset: ego_small
  num_workers: 0
  generation_batch_size: 40
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 100
      generation_batch_interval: 1
  higher_order:
    batch_size: 32
  ou:
    batch_size: 64
