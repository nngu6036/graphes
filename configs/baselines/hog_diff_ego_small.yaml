# Stage iteration counts are resolved from the actual train split at launch.
comparison:
  model: hog_diff
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: native_budget_capped_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 10000
    target_train_passes: 5500
    stage_exposure_weights:
      higher_order: 448000
      ou: 256000
    resolution: wrapper_from_actual_prepared_train_split
    native_equivalent_train_passes: 5500
    native_total_graph_exposures: 704000
    cap_applied: true
    cap_source: comparison.native_budget stage iterations
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is capped at the smaller released two-stage HOG-Diff budget; checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_two_stage_budget
    unit: stage_iterations
    source: configs/ego.yaml
    higher_order_iterations: 14000
    higher_order_batch_size: 32
    ou_iterations: 4000
    ou_batch_size: 64
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: ego.yaml
  native_dataset: ego_small
  num_workers: 0
  generation_batch_size: 40
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 100
      generation_batch_interval: 1
  higher_order:
    batch_size: 32
  ou:
    batch_size: 64
