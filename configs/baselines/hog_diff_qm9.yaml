# Stage iteration counts are resolved from the actual train split at launch.
comparison:
  model: hog_diff
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_guarded_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 200
    stage_exposure_weights:
      higher_order: 2944000
      ou: 52224000
    resolution: wrapper_from_actual_prepared_train_split
    native_total_graph_exposures: 55168000
    native_equivalent_train_passes: 527.091196
    prepared_train_graphs_for_native_equivalent: 104665
    cap_applied: false
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is min(common target, 
    declared native/reference budget); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_two_stage_budget
    unit: stage_iterations
    source: configs/qm9.yaml
    higher_order_iterations: 92000
    higher_order_batch_size: 32
    ou_iterations: 102000
    ou_batch_size: 512
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: qm9.yaml
  native_dataset: qm9
  num_workers: 0
  generation_batch_size: 256
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds:
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 200
      generation_batch_interval: 1
  higher_order:
    batch_size: 32
  ou:
    batch_size: 512
