comparison:
  model: catflow
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: adapter_budget_requires_validation_check
    unit: epochs
    source: GraphER adapter; uploaded CatFlow README has no Ego profile
    epochs: 1000
    batch_size: 128
catflow:
  train:
    epochs: 10000
    batch_size: 128
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 200
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
