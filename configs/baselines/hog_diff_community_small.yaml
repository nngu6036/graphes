comparison:
  model: hog_diff
  dataset: community_small
  common_config: common_community_small.yaml
  status: exact_upstream_two_stage_profile
  budget:
    basis: upstream_released_two_stage_budget
    unit: stage_iterations
    source: configs/cs.yaml
    higher_order_iterations: 6000
    higher_order_batch_size: 64
    ou_iterations: 22000
    ou_batch_size: 32
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: cs.yaml
  native_dataset: community_small
  num_workers: 0
  generation_batch_size: 20
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 100
      generation_batch_interval: 1
  higher_order:
    n_iters: 6000
    batch_size: 64
  ou:
    n_iters: 22000
    batch_size: 32
