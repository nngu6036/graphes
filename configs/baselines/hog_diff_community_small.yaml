# HOG-Diff baseline on GraphER's frozen Community-small split.
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: cs.yaml
  native_dataset: community_small
  num_workers: 0
  generation_batch_size: 20
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: "0"
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 100
      generation_batch_interval: 1
