comparison:
  model: gdsm_simple
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: matched_to_released_gdsm_reference_horizon
    unit: epochs
    epochs: 200
    batch_size: 64
gdsm_simple:
  train:
    epochs: 10000
    batch_size: 64
    lr: 0.0002
    weight_decay: 1.0e-06
    grad_norm: 1.0
    validation_every: 5
    log_every: 10
  model:
    max_nodes: 18
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    ff_dim: 256
    dropout: 0.0
  diffusion:
    steps: 1000
    beta_start: 0.0001
    beta_end: 0.02
  sample:
    steps: 100
    threshold: 0.5
    sort_eigenvalues: true
  generation_batch_size: 128
  runtime:
    device: auto
  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none
