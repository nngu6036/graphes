comparison:
  model: gdss
  dataset: ego_small
  common_config: common_ego_small.yaml
  status: exact_upstream_dataset_profile
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/ego_small.yaml
    epochs: 5000
    batch_size: 128
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: ego_small.yaml
  native_dataset: ego_small
  config_overrides:
    data:
      max_feat_num: 18
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 1000
      generation_batch_interval: 1
  batch_size: 128
  train:
    num_epochs: 5000
    lr: 0.01
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999
    eps: 1.0e-05
  sample:
    use_ema: false
