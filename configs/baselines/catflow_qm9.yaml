comparison:
  model: catflow
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_guarded_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 200
    epochs: 200
    cap_applied: false
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is min(common target, 
    declared native/reference budget); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: uploaded CatFlow README QM9 command
    epochs: 300
    batch_size: 1024
catflow:
  train:
    epochs: 200
    batch_size: 1024
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 5
    validation_repeats: 4
    checkpoint_every: 20
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
