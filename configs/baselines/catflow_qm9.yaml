comparison:
  model: catflow
  dataset: qm9
  common_config: common_qm9.yaml
  status: upstream_released_budget_with_graphes_linear_path_integration
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: uploaded CatFlow README QM9 command
    epochs: 300
    batch_size: 1024
  fairness_note: Epoch/batch/LR values come from the uploaded CatFlow README. The
    GraphER wrapper uses the documented linear-v2 path integration rather than the
    uploaded fixed-endpoint-noise training branch; record this adaptation when reporting.
catflow:
  train:
    epochs: 300
    batch_size: 1024
    lr: 0.0002
    ema: 0.999
    log_every: 10
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 100
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
