# GDSS baseline on GraphER's HOG-Diff/GDSS-aligned ZINC250k split.
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: zinc250k.yaml
  sampling_config: sample_zinc250k.yaml
  native_dataset: ZINC250k
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: "0"
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 50
      generation_batch_interval: 1
