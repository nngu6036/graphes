comparison:
  model: gdss
  dataset: zinc
  common_config: common_zinc.yaml
  status: exact_upstream_dataset_profile
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/zinc250k.yaml
    epochs: 500
    batch_size: 1024
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: zinc250k.yaml
  sampling_config: sample_zinc250k.yaml
  native_dataset: ZINC250k
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 50
      generation_batch_interval: 1
  batch_size: 1024
  train:
    num_epochs: 500
    lr: 0.005
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999
    eps: 1.0e-05
