comparison:
  model: gdss
  dataset: zinc
  common_config: common_zinc.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 200
    epochs: 200
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/zinc250k.yaml
    epochs: 500
    batch_size: 1024
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: zinc250k.yaml
  sampling_config: sample_zinc250k.yaml
  native_dataset: ZINC250k
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 50
      generation_batch_interval: 1
  batch_size: 1024
  train:
    num_epochs: 200
    lr: 0.005
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.9975018746874609
    eps: 1.0e-05
