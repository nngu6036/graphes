comparison:
  model: digress
  dataset: qm9
  common_config: common_qm9.yaml
  status: native_budget_guarded_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 200
    target_train_passes: 200
    epochs: 200
    cap_applied: false
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is min(common target, 
    declared native/reference budget); checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/qm9_no_h.yaml
    epochs: 1000
    batch_size: 1024
digress:
  native_dataset: qm9
  experiment: qm9_no_h
  n_epochs: 200
  batch_size: 1024
  num_workers: 0
  check_val_every_n_epochs: 5
  save_every_n_epochs: 20
  generation_batch_size: 256
  training_estimates:
    enabled: true
    num_graphs: 1024
    batch_size: 256
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 10
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
