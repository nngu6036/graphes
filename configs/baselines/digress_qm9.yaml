digress:
  native_dataset: qm9
  experiment: qm9_no_h
  n_epochs: 1000
  batch_size: 1024
  num_workers: 8
  check_val_every_n_epochs: 5
  save_every_n_epochs: 100
  generation_batch_size: 256

  # The wrapper recomputes node-count, atom, edge, and valency priors from the
  # exact GraphES train/validation artifacts rather than using bundled QM9 data.
  training_estimates:
    enabled: true
    num_graphs: 1024
    batch_size: 256

  runtime:
    gpus: 1
    cuda_visible_devices: "0"
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 10
      generation_batch_interval: 1
