comparison:
  model: digress
  dataset: qm9
  common_config: common_qm9.yaml
  status: exact_upstream_qm9_no_h
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/qm9_no_h.yaml
    epochs: 1000
    batch_size: 1024
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
digress:
  native_dataset: qm9
  experiment: qm9_no_h
  n_epochs: 1000
  batch_size: 1024
  num_workers: 0
  check_val_every_n_epochs: 5
  save_every_n_epochs: 100
  generation_batch_size: 256
  training_estimates:
    enabled: true
    num_graphs: 1024
    batch_size: 256
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 10
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
