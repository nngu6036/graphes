comparison:
  model: gdsm
  dataset: grid
  common_config: null
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/grid.yaml
    epochs: 5000
    batch_size: 8
gdsm:
  upstream_config: grid.yaml
  train:
    epochs: 10000
    batch_size: 8
    log_every: 10
    lr: 0.01
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999499874937461
    eps: 1.0e-05
  sample:
    use_ema: true
  generation_batch_size: 8
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: GDSM
  python_env: GDSM_PYTHON
  training_estimates:
    enabled: false
