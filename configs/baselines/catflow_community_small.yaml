comparison:
  model: catflow
  dataset: community_small
  common_config: common_community_small.yaml
  status: graphes_linear_v2_generic_adapter_budget_requires_validation_check
  budget:
    basis: adapter_budget_not_upstream_native
    unit: epochs
    source: GraphER CatFlow linear-v2 adapter; uploaded CatFlow README has no generic
      graph profile
    epochs: 10000
    batch_size: 128
  fairness_note: The uploaded CatFlow release has no generic Community-small profile.
    This explicit linear-v2 budget prevents DeFoG fallback leakage but is not claimed
    compute- or convergence-equivalent; tune only on validation.
catflow:
  train:
    epochs: 10000
    batch_size: 128
    lr: 0.0002
    ema: 0.999
    log_every: 100
    distribution: normal
    loss_function: kld
    path: linear
    validation_every: 100
    validation_repeats: 4
    checkpoint_every: 1000
  model:
    num_layers: 6
    small_model: 0
  sample:
    method: dopri5
    t_end: 0.95
    steps: 100
    atol: 1.0e-05
    rtol: 1.0e-05
    use_ema: true
    checkpoint_selection: auto
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: CATFLOW
  python_env: CATFLOW_PYTHON
  training_estimates:
    enabled: false
