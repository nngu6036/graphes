comparison:
  model: gdss
  dataset: grid
  common_config: null
  status: native_budget_capped_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 10000
    target_train_passes: 5000
    epochs: 5000
    cap_applied: true
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is capped at the smaller upstream native budget; checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/grid.yaml
    epochs: 5000
    batch_size: 8
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: grid.yaml
  native_dataset: grid
  num_workers: 0
  generation_batch_size: 8
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 1000
      generation_batch_interval: 1
  batch_size: 8
  train:
    num_epochs: 5000
    lr: 0.01
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999
    eps: 1.0e-05
  sample:
    use_ema: true
