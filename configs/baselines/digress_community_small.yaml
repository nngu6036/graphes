comparison:
  model: digress
  dataset: community_small
  common_config: common_community_small.yaml
  status: exact_upstream_comm20
  budget:
    basis: upstream_released_profile
    unit: epochs
    source: configs/experiment/comm20.yaml
    epochs: 1000000
    batch_size: 256
  fairness_note: Model-specific training budget overrides the DeFoG reference fallback;
    select adaptations on validation only, never on test metrics.
digress:
  native_dataset: comm20
  experiment: comm20
  n_epochs: 1000000
  batch_size: 256
  num_workers: 0
  check_val_every_n_epochs: 1000
  save_every_n_epochs: 10000
  generation_batch_size: 64
  training_estimates:
    enabled: true
  runtime:
    gpus: 1
    cuda_visible_devices: '0'
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 2000
      generation_batch_interval: 1
  hydra_overrides:
  - train.lr=0.0002
  - train.weight_decay=1e-12
  - train.ema_decay=0.0
  - train.optimizer=adamw
