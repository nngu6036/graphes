comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: graphes_exposure_matched_adaptation
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000

gdsm_simple:
  train:
    # 64 training graphs / batch 16 = 4 updates per epoch.
    # 10000 epochs ~= 40,000 optimizer updates.
    epochs: 10000
    batch_size: 16
    lr: 0.0002
    weight_decay: 1.0e-6

  model:
    # Keep the S0 denoiser capacity unchanged. This stage changes generation only.
    max_nodes: 20
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    ff_dim: 256

  diffusion:
    steps: 1000
    beta_start: 0.0001
    beta_end: 0.02

  sample:
    # Full reverse chain; threshold graph is retained as threshold_graphs.pkl.
    steps: 1000
    threshold: 0.5
    sort_eigenvalues: true

  generation_batch_size: 128

  extensions:
    degree_conditioning: false
    hh_initialization: false

    # Source-preserving spectral refinement. Start from the exact GSDM threshold
    # graph, freeze its degree sequence, and only make a few conservative swaps.
    degree_preserving_rewiring: true
    rewiring:
      mode: source_preserving

      # Keep the correction local: the original GSDM output is already strong.
      max_steps: 4
      proposal_budget: 256
      valid_candidate_budget: 128
      min_relative_improvement: 1.0e-6
      relative_improvement_epsilon: 1.0e-12
      preserve_connectivity_if_source_connected: true
      reject_revisited_states: true

      # Joint spectral/source objective. Lambda must improve monotonically; the
      # sampled empirical U is preserved through a low-rank projector target.
      lambda_weight: 1.0
      projector_weight: 1.0
      source_weight: 0.1
      projector_rank: 4
      projector_normalization_floor: 0.05
      projector_relative_worsening_tolerance: 0.10
      require_lambda_improvement: true

      # Refine only the highest-residual quarter of GSDM threshold samples.
      gate_enabled: true
      gate_initial_lambda_quantile: 0.75

    structural_summary: none
