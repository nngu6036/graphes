comparison:
  model: gdsm_simple
  dataset: community_small
  common_config: common_community_small.yaml
  status: graphes_native_high_budget_reference

gdsm_simple:
  train:
    # 64 training graphs / batch 16 = 4 updates per epoch.
    # 5000 epochs ~= 20,000 optimizer updates.
    epochs: 5000
    batch_size: 16

    lr: 0.0002
    weight_decay: 1.0e-6

  model:
    # Keep model capacity unchanged so this is a compute-budget
    # experiment rather than an architecture experiment.
    max_nodes: 20
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    ff_dim: 256

  diffusion:
    # Keep the same forward diffusion process.
    steps: 1000
    beta_start: 0.0001
    beta_end: 0.02

  sample:
    # Previously 100. Use the complete reverse chain so that
    # sampling approximation is not the bottleneck.
    steps: 1000

    threshold: 0.5
    sort_eigenvalues: true

  generation_batch_size: 128

  extensions:
    degree_conditioning: false
    hh_initialization: false
    degree_preserving_rewiring: false
    structural_summary: none