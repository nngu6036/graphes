comparison:
  model: gdss
  dataset: community_small
  common_config: common_community_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    epochs: 10000
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/community_small.yaml
    epochs: 5000
    batch_size: 128
gdss:
  source_env: GDSS
  python_env: GDSS_PYTHON
  upstream_config: community_small.yaml
  native_dataset: community_small
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 1000
      generation_batch_interval: 1
  batch_size: 128
  train:
    num_epochs: 10000
    lr: 0.01
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999499874937461
    eps: 1.0e-05
  sample:
    use_ema: false
