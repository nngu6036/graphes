# Stage iteration counts are resolved from the actual train split at launch.
comparison:
  model: hog_diff
  dataset: zinc
  common_config: common_zinc.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 200
    stage_exposure_weights:
      higher_order: 12288000
      ou: 64000000
    resolution: wrapper_from_actual_prepared_train_split
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_two_stage_budget
    unit: stage_iterations
    source: configs/zinc250k.yaml
    higher_order_iterations: 12000
    higher_order_batch_size: 1024
    ou_iterations: 1000000
    ou_batch_size: 64
hog_diff:
  source_env: HOGDIFF
  python_env: HOGDIFF_PYTHON
  upstream_config: zinc250k.yaml
  native_dataset: zinc250k
  num_workers: 0
  generation_batch_size: 128
  training_estimates:
    enabled: false
  runtime:
    device: auto
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      iteration_interval: 100
      generation_batch_interval: 1
  higher_order:
    batch_size: 1024
  ou:
    batch_size: 64
