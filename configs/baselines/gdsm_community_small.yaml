comparison:
  model: gdsm
  dataset: community_small
  common_config: common_community_small.yaml
  status: native_budget_capped_adaptation
  budget:
    basis: common_target_capped_by_native_budget
    unit: train_set_passes
    common_target_train_passes: 10000
    target_train_passes: 200
    epochs: 200
    cap_applied: true
    cap_source: comparison.native_budget
  fairness_note: Uses the common training budget only as an upper bound. The effective budget is capped at the smaller upstream native budget; checkpoint selection and tuning use validation only.
  native_budget:
    basis: upstream_released_profile
    unit: epochs
    source: config/community_small.yaml
    epochs: 200
    batch_size: 128
gdsm:
  upstream_config: community_small.yaml
  train:
    epochs: 200
    batch_size: 128
    log_every: 10
    lr: 0.01
    lr_schedule: true
    ema: 0.999
    weight_decay: 0.0001
    grad_norm: 1.0
    lr_decay: 0.999
    eps: 1.0e-05
  sample:
    use_ema: false
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: GDSM
  python_env: GDSM_PYTHON
  training_estimates:
    enabled: false
