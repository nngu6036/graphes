# Source-backed GSDM on frozen GraphER community_small splits.
# Rerun starting point, not a claim of paper-identical settings or reproduced metrics.
gdsm:
  upstream_config: community_small.yaml
  train:
    epochs: 200
    batch_size: 128
    log_every: 10
  sample:
    use_ema: false
  generation_batch_size: 128
  runtime:
    device: auto
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
  source_env: GDSM
  python_env: GDSM_PYTHON
  training_estimates:
    enabled: false
