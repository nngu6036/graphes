comparison:
  model: graphrnn
  dataset: community_small
  common_config: common_community_small.yaml
  status: graphes_exposure_matched_adaptation
  budget:
    basis: graphes_controlled_comparison
    unit: train_set_passes
    target_train_passes: 10000
    nominal_train_graphs: 64
    resolution: wrapper_from_actual_prepared_train_split
    epochs: 625
  fairness_note: Matches training graph exposure, not compute or optimizer updates.
    Select checkpoints and tune only on validation.
  native_budget:
    basis: upstream_released_default_budget
    unit: epochs_x_minibatches
    source: args.py
    epochs: 3000
    batches_per_epoch: 32
    optimizer_steps: 96000
    batch_size: 32
experiment: graphrnn_community_small
benchmark: community_small
protocol:
  evaluation_seeds:
  - 42
  - 43
  - 44
  report_mean_and_std: true
  generated_graphs_per_seed: 1024
  max_reference_graphs: null
  tune_on_split: val
  final_split: test
dataset:
  name: sbm
  benchmark: community_small
  config_path: configs/datasets/community_small.yaml
  root: outputs/datasets
  build_if_missing: false
evaluation:
  generic_mmd_protocol: graphrnn
  generic_clustering_bins: 100
  orca_exec: null
  compute_orbit: true
  graphlet_backend: sampled
graphrnn:
  source_env: GRAPHRNN
  python_env: GRAPHRNN_PYTHON
  variant: GraphRNN_RNN
  max_num_node: 20
  max_prev_node: 19
  hidden_size_rnn: 128
  hidden_size_rnn_output: 16
  embedding_size_rnn: 64
  embedding_size_rnn_output: 8
  embedding_size_output: 64
  num_layers: 4
  batch_size: 32
  batch_ratio: 32
  epochs: 625
  learning_rate: 0.003
  milestones:
  - 83
  - 208
  lr_rate: 0.3
  scheduler_step_unit: batch
  num_workers: 0
  save_every_epochs: 62
  log_every_epochs: 12
  gradient_clip_norm: null
  sample_time: 1
  generation_batch_size: 32
  deterministic: false
  torch_num_threads: null
  training_estimates:
    enabled: true
  runtime:
    device: auto
    python_executable: null
    cuda_visible_devices: '0'
    timeout_seconds: null
    progress:
      enabled: true
      stream_output: true
      interval_seconds: 15
      epoch_interval: 10
      generation_batch_interval: 1
