model: grapher
architecture: generic_complete_action_grapher

# Larger scorer/encoder than the smoke-test config, but still practical for SBM-64.
hidden_dim: 192
num_layers: 4
dropout: 0.05
k_eigen: 8

# Keep the path horizon at the already-tested SBM-64 value. Increase only after
# measuring remaining teacher discrepancy after 16 steps.
num_steps: 32
max_steps_per_graph: 16

# Strong teacher search, same train candidate size as the better previous run.
candidate_budget: 64
offline_candidate_budget: 256
k_hop: 2
ensure_connected: true
init_method: havel_hakimi
teacher_discrepancy: edge_symmetric_difference
require_positive_teacher_improvement: true

# Conditioning dimensions. Explicit values keep checkpoints comparable for SBM-64.
max_nodes: 64
degree_histogram_dim: 64
time_embedding_dim: 192
local_feature_dim: 8

# Optimization. Lower LR/WD for the larger model; reuse the expensive teacher cache
# more, but do not double examples_per_epoch yet.
learning_rate: 0.0007
weight_decay: 0.00001
grad_clip: 5.0
epochs: 60
max_graphs: 4096

# Sampling temperatures.
degree_sample_temperature: 1.0
action_temperature: 1.0
sample_actions: true

checkpoint_path: outputs/checkpoints/{dataset}/grapher/grapher.pt
dhvae_checkpoint_path: outputs/checkpoints/{dataset}/dhvae/dhvae.pt
samples_path: outputs/samples/{dataset}/grapher.pkl

# Training implementation controls.
grad_accum_steps: 16
use_amp: true
examples_per_epoch: 16384
save_teacher_cache: true
teacher_cache_checkpoint_interval: 50
force_rebuild_teacher_cache: false
