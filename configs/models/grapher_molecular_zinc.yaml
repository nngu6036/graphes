model: grapher_molecular
architecture: molecular_typed_action_grapher

hidden_dim: 192
num_layers: 4
dropout: 0.05
k_eigen: 8
time_embedding_dim: 192
local_feature_dim: 24

num_steps: 24
max_steps_per_graph: 16

candidate_budget: 64
offline_candidate_budget: 192
k_hop: 2
ensure_connected: true
target_candidate_fraction: 0.50
global_candidate_fraction: 0.15
bond_type_proposals_per_edge: 2
bond_type_proposal_mode: sample
source_edge_type_strategy: sample
empirical_bond_smoothing: 0.10
allow_global_bond_backoff: true
reject_unseen_endpoint_pairs: false

bond_order_by_type:
  1: 1.0
  2: 2.0
  3: 3.0
  4: 1.5
# ZINC contains more atom/charge environments, so use training-set maxima by
# default. Supply atomic-number overrides here when the preprocessing retains
# formal charge and a domain-specific valence table is desired.
max_valence_by_node_type: null
valence_tolerance: 1.0e-6

teacher_topology_weight: 1.0
teacher_bond_type_weight: 1.0
teacher_clustering_weight: 0.10
require_positive_teacher_improvement: true

learning_rate: 0.0004
weight_decay: 0.00001
grad_clip: 5.0
epochs: 80
max_graphs: 20000
examples_per_epoch: 32768
grad_accum_steps: 16
use_amp: true

max_nodes: null
degree_histogram_dim: null
checkpoint_path: outputs/checkpoints/{dataset}/grapher_molecular/grapher_molecular.pt
