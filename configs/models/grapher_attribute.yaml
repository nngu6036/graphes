model: grapher
architecture: generic_complete_action_grapher
hidden_dim: 128
num_layers: 3
dropout: 0.0
k_eigen: 4

# Flow/sampling horizon. Training uses normalized time t=s/L; generation uses
# t=s/S and samples complete double-edge-swap actions a=(e1,e2,r).
num_steps: 32
max_steps_per_graph: 8

# Candidate construction.
candidate_budget: 64
offline_candidate_budget: 256
k_hop: 2
ensure_connected: true
init_method: havel_hakimi
teacher_discrepancy: edge_symmetric_difference
require_positive_teacher_improvement: false

# Conditioning dimensions. max_nodes/degree_histogram_dim are inferred from the
# training split if left null, then saved in the checkpoint.
max_nodes: null
degree_histogram_dim: null
time_embedding_dim: 128
local_feature_dim: 8

# Optimization.
learning_rate: 0.001
weight_decay: 0.0
grad_clip: 5.0
epochs: 5
max_graphs: null

# Degree prior and rewiring sampling temperatures.
degree_sample_temperature: 1.0
action_temperature: 1.0
sample_actions: true

checkpoint_path: outputs/checkpoints/{dataset}/grapher/grapher.pt
dhvae_checkpoint_path: outputs/checkpoints/{dataset}/dhvae/dhvae.pt
samples_path: outputs/samples/{dataset}/grapher.pkl
