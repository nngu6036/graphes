# Historical filename kept for compatibility. The implementation is now the
# paper-aligned size-conditioned Degree-Histogram VAE (DH-VAE).
model: dhvae
architecture: size_conditioned_dhvae
hidden_dim: 128
latent_dim: 32
size_embedding_dim: 32
learning_rate: 0.001
weight_decay: 0.0
epochs: 1000
batch_size: 64
beta_kl: 0.001
grad_clip: 5.0

# Inferred from training data when null. max_nodes controls the empirical size
# prior support and valid degree bins 0..n-1. histogram_dim is normally equal to
# max_nodes, with zero padding for smaller graphs.
max_nodes: null
histogram_dim: null

# Sampling temperature for pi_theta(k | z, n).
sample_temperature: 1.0

checkpoint_path: outputs/checkpoints/{dataset}/msvae/msvae.pt
samples_path: outputs/samples/{dataset}/msvae_degree_sequences.pkl
