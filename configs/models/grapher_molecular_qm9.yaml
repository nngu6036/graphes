model: grapher_molecular
architecture: molecular_typed_action_grapher

# Edge-aware attributed action scorer.
hidden_dim: 160
num_layers: 4
dropout: 0.05
k_eigen: 6
time_embedding_dim: 160
local_feature_dim: 24

# Teacher path and generation-time horizon metadata.
num_steps: 16
max_steps_per_graph: 12

# Typed candidate construction. Node types remain fixed. Each new edge obtains
# candidate labels from p_emp(edge_type | unordered endpoint node types).
candidate_budget: 48
offline_candidate_budget: 128
k_hop: 2
ensure_connected: true
target_candidate_fraction: 0.50
global_candidate_fraction: 0.10
bond_type_proposals_per_edge: 2
bond_type_proposal_mode: sample
source_edge_type_strategy: sample
empirical_bond_smoothing: 0.10
allow_global_bond_backoff: true
reject_unseen_endpoint_pairs: false

# Bond-order values used by the valence filter.
bond_order_by_type:
  1: 1.0
  2: 2.0
  3: 3.0
  4: 1.5
# Optional chemically grounded overrides. Any omitted type falls back to the
# maximum bond-order sum observed in the training split.
max_valence_by_node_type:
  1: 1.0   # H
  6: 4.0   # C
  7: 3.0   # N in neutral QM9
  8: 2.0   # O
  9: 1.0   # F
valence_tolerance: 1.0e-6

# Attributed teacher discrepancy.
teacher_topology_weight: 1.0
teacher_bond_type_weight: 1.0
teacher_clustering_weight: 0.10
require_positive_teacher_improvement: true

# Optimization.
learning_rate: 0.0005
weight_decay: 0.00001
grad_clip: 5.0
epochs: 80
max_graphs: 10000
examples_per_epoch: 20000
grad_accum_steps: 16
use_amp: true

max_nodes: null
degree_histogram_dim: null
checkpoint_path: outputs/checkpoints/{dataset}/grapher_molecular/grapher_molecular.pt
